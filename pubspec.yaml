name: sales_erp
description: "Flutter mobile client for the Sales ERP platform."
publish_to: 'none'

version: 0.124.0+124

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cookie_jar: ^4.0.8
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  firebase_app_installations: ^0.4.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  sqflite: ^2.4.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true

  assets:
    - assets/logo/app_logo.jpeg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/app_logo.jpeg
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/logo/app_logo.jpeg
