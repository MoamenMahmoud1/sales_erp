name: sales_erp

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  sqflite: ^2.4.3
  path: ^1.9.1
  workmanager: ^0.10.9
  local_auth: ^3.0.2
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true

  assets:
    - assets/logo/app_logo.jpeg
    - assets/images/sales_erp_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app_logo.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_logo.jpeg"

