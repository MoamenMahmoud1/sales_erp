name: Backend Sync vs Async Benchmark

on:
  push:
    branches: [main]
    paths:
      - "erp-api/benchmarks/**"
      - "erp-api/core/settings/settings_bench.py"
      - "erp-api/products/api/views.py"
      - "erp-api/products/api/sync_views.py"
      - "erp-api/products/urls.py"
      - "erp-api/products/models.py"
      - "erp-api/inventory/models.py"
      - "erp-api/inventory/services/**"
      - "erp-api/invoices/models.py"
      - "erp-api/invoices/api/**"
      - "erp-api/invoices/services/**"
      - "erp-api/payments/api/**"
      - "erp-api/payments/services/**"
      - "erp-api/purchases/api/**"
      - "erp-api/purchases/services/**"
      - "erp-api/common/services/**"
      - "erp-api/**/migrations/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

concurrency:
  group: backend-sync-async-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "10"
      WEB_CONCURRENCY: "2"
      TRUST_PROXY_HEADERS: "false"
      BENCH_REQUESTS: "600"
      BENCH_WARMUP: "50"
      BENCH_TIMEOUT: "10"
      BENCH_DEADLINE: "60"
      BENCH_PROGRESS_EVERY: "100"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx uvicorn-worker

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Configure benchmark PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET effective_cache_size='2GB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET effective_io_concurrency='200';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET track_io_timing='on';"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 60); do
            if PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "SELECT 1" >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py

      - name: Analyze and inspect PostgreSQL plan
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ANALYZE;"
          python benchmarks/postgres_diagnostics.py > benchmark-results/postgres-diagnostics.json
          {
            echo "# Environment"
            date -u
            echo "CPU logical: $(nproc)"
            lscpu | grep -E 'Model name|CPU\\(s\\)|Thread|Core|Socket' || true
            free -h
            python --version
            python -c 'import django; print("Django", django.get_version())'
            python -c 'import adrf; print("ADRF", getattr(adrf, "__version__", "unknown"))'
            python -c 'import httpx; print("httpx", httpx.__version__)'
            PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "SHOW server_version; SHOW max_connections; SHOW shared_buffers; SHOW effective_cache_size; SHOW work_mem; SHOW random_page_cost; SHOW effective_io_concurrency; SHOW jit; SHOW track_io_timing;"
          } > benchmark-results/environment.md

      - name: Run true pure sync and async stack benchmarks
        run: |
          set -euo pipefail
          TOKEN="$(cat bench_token.txt)"
          BASE="http://127.0.0.1:8000"
          ENDPOINT="/api/v1/products/?page=1&page_size=20"
          start_server() {
            mode="$1"
            export BENCH_API_STACK="$mode"
            if [[ "$mode" == "sync" ]]; then
              gunicorn core.wsgi:application --bind 127.0.0.1:8000 --workers 2 --worker-class sync --timeout 30 --access-logfile /dev/null --error-logfile "/tmp/gunicorn-${mode}.log" --log-level warning &
            else
              gunicorn core.asgi:application --bind 127.0.0.1:8000 --workers 2 --worker-class uvicorn_worker.UvicornWorker --timeout 30 --access-logfile /dev/null --error-logfile "/tmp/gunicorn-${mode}.log" --log-level warning &
            fi
            SERVER_PID=$!
            for attempt in $(seq 1 60); do
              if curl -fsS "$BASE/health/live/" >/dev/null; then return; fi
              sleep 1
            done
            cat "/tmp/gunicorn-${mode}.log" || true
            exit 1
          }
          stop_server() {
            if [[ -n "${SERVER_PID:-}" ]] && kill -0 "$SERVER_PID" 2>/dev/null; then kill "$SERVER_PID" || true; wait "$SERVER_PID" || true; fi
            SERVER_PID=""
          }
          trap 'stop_server' EXIT
          for mode in sync async; do
            start_server "$mode"
            for concurrency in 1 5 10 25 50 100; do
              echo "=== ${mode} concurrency=${concurrency} ==="
              BENCH_URL="${BASE}${ENDPOINT}" BENCH_TOKEN="$TOKEN" BENCH_CONCURRENCY="$concurrency" BENCH_REQUESTS=600 BENCH_WARMUP=50 BENCH_DEADLINE=60 BENCH_TIMEOUT=10 \
                python benchmarks/http_benchmark.py | tee "benchmark-results/${mode}-c${concurrency}.jsonl"
            done
            BENCH_URL="${BASE}${ENDPOINT}" BENCH_TOKEN="$TOKEN" BENCH_CONCURRENCY=100 BENCH_REQUESTS=500 BENCH_WARMUP=100 BENCH_DEADLINE=60 BENCH_TIMEOUT=10 \
              python benchmarks/transport_diagnostics.py | tee "benchmark-results/${mode}-transport-c100.jsonl"
            echo "=== ${mode} server errors ==="
            cat "/tmp/gunicorn-${mode}.log" || true
            stop_server
          done

      - name: Run focused DB-pool sweep
        run: |
          set -euo pipefail
          TOKEN="$(cat bench_token.txt 2>/dev/null || true)"
          if [[ -z "$TOKEN" ]]; then
            python benchmarks/seed_benchmark_data.py >/dev/null
            TOKEN="$(cat bench_token.txt)"
          fi
          BASE="http://127.0.0.1:8000"
          ENDPOINT="/api/v1/products/?page=1&page_size=20"
          for mode in sync async; do
            export BENCH_API_STACK="$mode"
            for pool in 5 10 20 40; do
              export DB_POOL_MAX_SIZE="$pool"
              if [[ "$mode" == "sync" ]]; then
                gunicorn core.wsgi:application --bind 127.0.0.1:8000 --workers 2 --worker-class sync --timeout 30 --access-logfile /dev/null --error-logfile "/tmp/gunicorn-pool.log" --log-level warning &
              else
                gunicorn core.asgi:application --bind 127.0.0.1:8000 --workers 2 --worker-class uvicorn_worker.UvicornWorker --timeout 30 --access-logfile /dev/null --error-logfile "/tmp/gunicorn-pool.log" --log-level warning &
              fi
              SERVER_PID=$!
              for attempt in $(seq 1 60); do curl -fsS "$BASE/health/live/" >/dev/null 2>&1 && break; sleep 1; done
              for concurrency in 25 100; do
                echo "=== ${mode} pool=${pool} concurrency=${concurrency} ==="
                BENCH_URL="${BASE}${ENDPOINT}" BENCH_TOKEN="$TOKEN" BENCH_CONCURRENCY="$concurrency" BENCH_REQUESTS=500 BENCH_WARMUP=100 BENCH_DEADLINE=60 BENCH_TIMEOUT=10 \
                  python benchmarks/http_benchmark.py | tee "benchmark-results/${mode}-pool${pool}-c${concurrency}.jsonl"
              done
              kill "$SERVER_PID" || true
              wait "$SERVER_PID" || true
              SERVER_PID=""
            done
          done

      - name: Build benchmark report
        if: always()
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("benchmark-results")
          measured = []
          transports = []
          probes = []

          for path in sorted(root.glob("*.jsonl")):
              match = re.match(r"^(sync|async)(?:-pool(\d+))?-c(\d+)\.jsonl$", path.name)
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  try:
                      item = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if item.get("phase") == "measured":
                      row = dict(item)
                      if match:
                          row["mode"] = match.group(1)
                          row["pool"] = int(match.group(2)) if match.group(2) else None
                          row["kind"] = "pool" if match.group(2) else "main"
                          row["file"] = path.name
                      measured.append(row)
                  elif item.get("phase") == "transport":
                      row = dict(item)
                      row["file"] = path.name
                      transports.append(row)
                  elif item.get("phase") == "transport_probe":
                      row = dict(item)
                      row["file"] = path.name
                      probes.append(row)

          measured.sort(key=lambda x: (x["kind"], x["mode"], x.get("pool") or 0, x.get("concurrency", 0)))

          def fmt(value, digits=3):
              if value is None:
                  return ""
              if isinstance(value, bool):
                  return "yes" if value else "no"
              if isinstance(value, float):
                  return f"{value:.{digits}f}"
              return str(value)

          def table(rows, cols):
              out = ["| " + " | ".join(cols) + " |", "|" + "---|" * len(cols)]
              for row in rows:
                  out.append("| " + " | ".join(fmt(row.get(c)) for c in cols) + " |")
              return "\n".join(out)

          main_rows = [r for r in measured if r.get("kind") == "main"]
          pool_rows = [r for r in measured if r.get("kind") == "pool"]

          report = []
          report.append("# True pure Sync vs Async root-cause benchmark")
          report.append("")
          report.append("The measured endpoint is the same products list. Sync uses DRF + Django sync ORM; Async uses ADRF + Django async ORM. Every response is runtime-validated before it is counted as successful.")
          report.append("")
          report.append("## Runtime stack verification")
          report.append("")
          report.append("A measurement is considered stack-verified only when the response proves the expected router, bound handler, async callable state, event-loop state, and (for Async) both `acount` and async iteration operations.")
          report.append("")
          report.append(table(main_rows, ["mode", "concurrency", "requests", "successful", "failed", "rps", "p50_ms", "p95_ms", "p99_ms", "server_p50_ms", "db_p50_ms", "db_queries_mean", "stack_verified"]))
          report.append("")
          report.append("## DB-pool sweep")
          report.append("")
          report.append(table(pool_rows, ["mode", "pool", "concurrency", "requests", "successful", "failed", "rps", "p50_ms", "p95_ms", "p99_ms", "server_p50_ms", "db_p50_ms", "db_queries_mean", "stack_verified"]))
          report.append("")

          report.append("## Transport diagnostics")
          report.append("")
          report.append(table(transports, ["file", "concurrency", "requests", "successful", "rps", "http_p50_ms", "server_p50_ms", "db_p50_ms", "transport_minus_server_p50_ms", "stack_verified", "observed_stacks", "observed_routers", "observed_handlers", "observed_event_loops"]))
          report.append("")

          report.append("## Root-cause signals")
          report.append("")
          if main_rows:
              by_key = {(r["mode"], r["concurrency"]): r for r in main_rows}
              for concurrency in [1, 5, 10, 25, 50, 100]:
                  sync = by_key.get(("sync", concurrency))
                  async_ = by_key.get(("async", concurrency))
                  if sync and async_:
                      ratio = async_["rps"] / sync["rps"] if sync.get("rps") else None
                      report.append(f"- concurrency={concurrency}: Async/Sync RPS ratio = {fmt(ratio, 4)}; Async p99 = {fmt(async_.get('p99_ms'))} ms; Sync p99 = {fmt(sync.get('p99_ms'))} ms.")
          if pool_rows:
              async_c100 = [r for r in pool_rows if r.get("mode") == "async" and r.get("concurrency") == 100]
              if async_c100:
                  rps_values = [r["rps"] for r in async_c100]
                  spread = max(rps_values) - min(rps_values)
                  report.append(f"- Async c100 pool sweep RPS spread across pool=5..40: {fmt(spread, 3)} RPS; this quantifies whether pool size is the dominant limiter.")
          report.append("- PostgreSQL execution timing is reported separately from request wall time. A low DB timing fraction with a high request wall time points away from PostgreSQL execution as the primary bottleneck.")
          report.append("- The Async products path uses a batched serializer service boundary (`batched_sync_representation`) so serialization is one executor hop per page rather than ADRF's per-field sync-to-async crossings.")
          report.append("")

          (root / "report.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          summary = {
              "main_rows": main_rows,
              "pool_rows": pool_rows,
              "transport_rows": transports,
              "transport_probes": probes,
          }
          (root / "report.json").write_text(json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8")
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-vs-async-root-cause-benchmark
          path: erp-api/benchmark-results/
          if-no-files-found: warn
