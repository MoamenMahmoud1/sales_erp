name: Backend HTTP Benchmark

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "erp-api/core/settings/settings_bench.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

concurrency:
  group: backend-http-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "5"
      WEB_CONCURRENCY: "2"
      TRUST_PROXY_HEADERS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install Bombardier
        run: |
          go install github.com/codesenberg/bombardier@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Seed benchmark database
        run: |
          python manage.py shell <<'PY'
          import json
          from django.contrib.auth import get_user_model
          from inventory.models import StockBalance, StockLocation
          from products.models import Product
          from rest_framework_simplejwt.tokens import AccessToken

          User = get_user_model()
          users = []
          for index in range(100):
              username = f"bench_user_{index}"
              email = f"bench_user_{index}@example.com"
              user, _ = User.objects.get_or_create(
                  username=username,
                  defaults={"email": email, "is_active": True, "is_verified": True},
              )
              users.append(user)

          products = list(Product.objects.all()[:2000])
          if len(products) < 2000:
              start = len(products)
              products.extend(
                  Product.objects.bulk_create(
                      [
                          Product(
                              name=f"Benchmark Product {index:05d}",
                              purchase_price="10.00",
                              selling_price="15.00",
                          )
                          for index in range(start, 2000)
                      ],
                      batch_size=500,
                  )
              )

          location, _ = StockLocation.objects.get_or_create(
              name="Benchmark Warehouse",
              defaults={"location_type": StockLocation.LocationType.MAIN_WAREHOUSE},
          )
          StockBalance.objects.bulk_create(
              [
                  StockBalance(location=location, product=product, quantity=100)
                  for product in products
              ],
              batch_size=500,
              ignore_conflicts=True,
          )

          with open("bench_token.txt", "w", encoding="utf-8") as output:
              output.write(str(AccessToken.for_user(users[0])))
          PY

      - name: Record runner capacity
        run: |
          echo "=== CPU ==="
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          echo "=== MEMORY ==="
          free -h

      - name: Start server and benchmark
        run: |
          set -euo pipefail
          gunicorn core.asgi:application \
            --bind 127.0.0.1:8000 \
            --workers 2 \
            --worker-class uvicorn_worker.UvicornWorker \
            --timeout 30 \
            --access-logfile /dev/null \
            --error-logfile /tmp/gunicorn-error.log \
            --log-level warning &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null

          TOKEN="$(cat bench_token.txt)"
          BASE="http://127.0.0.1:8000"
          declare -A ENDPOINTS=(
            [health]="/health/live/"
            [products]="/api/v1/products/?page=1&page_size=20"
            [me]="/api/v1/auth/me/"
          )

          for endpoint_name in health products me; do
            echo ""
            echo "===== ${endpoint_name} ====="
            for concurrency in 1 10 25 50 100; do
              echo "--- concurrency=${concurrency} duration=10s ---"
              if [[ "$endpoint_name" == "health" ]]; then
                bombardier \
                  --connections="$concurrency" \
                  --duration=10s \
                  --timeout=30s \
                  --latencies \
                  --http1 \
                  "${BASE}${ENDPOINTS[$endpoint_name]}"
              else
                bombardier \
                  --connections="$concurrency" \
                  --duration=10s \
                  --timeout=30s \
                  --latencies \
                  --http1 \
                  --header="Authorization: Bearer ${TOKEN}" \
                  "${BASE}${ENDPOINTS[$endpoint_name]}"
              fi
            done
          done

          echo "=== SERVER ERRORS ==="
          if [[ -s /tmp/gunicorn-error.log ]]; then
            cat /tmp/gunicorn-error.log
          else
            echo "none"
          fi

      - name: Cleanup benchmark secret
        if: always()
        run: rm -f bench_token.txt
