name: One Shot Import Fix

on:
  push:
    branches: [refactor/car-architecture]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[import-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unused Car import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/car/presentation/car_trip_details_page.dart')
          text = p.read_text()
          text = text.replace("import '../domain/entities/car_trip_summary_view.dart';\n", '')
          p.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): remove unused Car import [import-fix]"
          git pull --rebase origin refactor/car-architecture
          git push origin HEAD:refactor/car-architecture
