name: Car Autofix

on:
  push:
    branches: [refactor/car-architecture]

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[car-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply Dart mechanical fixes
        run: dart fix --apply || true

      - name: Repair Car source and test lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path: str, fn):
              p = Path(path)
              text = p.read_text()
              new = fn(text)
              if new != text:
                  p.write_text(new)

          def drop_import(text: str, value: str) -> str:
              return '\n'.join(line for line in text.splitlines() if line.strip() != value) + ('\n' if text.endswith('\n') else '')

          edit('lib/features/car/data/car_mappers.dart', lambda t: drop_import(drop_import(t, "import '../domain/entities/car_payment.dart';"), "import '../domain/entities/car_trip_status.dart';"))
          edit('lib/features/car/data/local_car_trip_repository.dart', lambda t: drop_import(t, "import '../domain/entities/car_trip_status.dart';"))
          edit('lib/features/car/presentation/car_reports_page.dart', lambda t: drop_import(t, "import '../../../core/theme/app_tokens.dart';"))
          edit('lib/features/car/presentation/car_trip_details_page.dart', lambda t: drop_import(t, "import '../../../core/theme/app_tokens.dart';"))
          edit('lib/features/car/presentation/car_trip_editor_page.dart', lambda t: drop_import(t, "import '../domain/entities/car_financial_summary.dart';"))
          edit('test/features/car/data/car_persistence_test.dart', lambda t: drop_import(drop_import(drop_import(t, "import 'package:sqflite/sqflite.dart';"), "import 'package:sales_erp/features/car/domain/entities/car_payment.dart';"), "import 'package:sales_erp/features/car/domain/entities/car_trip_status.dart';"))
          edit('test/features/car/domain/car_payment_allocator_test.dart', lambda t: drop_import(t, "import 'package:sales_erp/features/car/domain/entities/car_payment.dart';"))
          edit('test/features/car/domain/car_payment_test.dart', lambda t: drop_import(t, "import 'package:sales_erp/features/car/domain/entities/car_payment.dart';"))

          def repair_editor(t: str) -> str:
              t = t.replace('pageBuilder: (_, _, _) => CarClosingAnimation(', 'pageBuilder: (context, animation, secondaryAnimation) => CarClosingAnimation(')
              t = t.replace('transitionsBuilder: (_, animation, _, child) =>', 'transitionsBuilder: (context, animation, secondaryAnimation, child) =>')
              t = t.replace('value: value,', 'initialValue: value,')

              product_start = t.index('  Widget _productCard(int id) {')
              quantity_start = t.index('  Widget _quantityField(', product_start)
              discount_start = t.index('  Widget _buildDiscountSection()', quantity_start)
              product = '''  Widget _productCard(int id) {\n    final product = _productsList.firstWhere((p) => p.id == id);\n    final loaded = _loaded[id] ?? 0;\n    final returned = _returned[id] ?? 0;\n    final sold = loaded - returned;\n    final discount = _discounts[id] ?? 0;\n    final scheme = Theme.of(context).colorScheme;\n    final line = _calculator.itemLine(_itemFor(id));\n\n    return Card(\n      margin: const EdgeInsets.only(bottom: 10),\n      child: Padding(\n        padding: const EdgeInsets.all(14),\n        child: Column(\n          children: [\n            Row(\n              children: [\n                Expanded(\n                  child: Column(\n                    crossAxisAlignment: CrossAxisAlignment.start,\n                    children: [\n                      Text(product.name, style: const TextStyle(fontWeight: FontWeight.w800)),\n                      const SizedBox(height: 3),\n                      Text(\n                        '${product.price.toStringAsFixed(2)} EGP / carton',\n                        style: TextStyle(color: scheme.onSurfaceVariant, fontSize: 12),\n                      ),\n                    ],\n                  ),\n                ),\n                IconButton(\n                  tooltip: 'Remove product',\n                  onPressed: () => setState(() {\n                    _loaded.remove(id);\n                    _returned.remove(id);\n                    _discounts.remove(id);\n                  }),\n                  icon: Icon(Icons.close_rounded, color: scheme.error),\n                ),\n              ],\n            ),\n            const SizedBox(height: 10),\n            Row(\n              children: [\n                Expanded(\n                  child: _quantityField(\n                    label: 'Loaded',\n                    value: loaded,\n                    onChanged: (v) => setState(() => _loaded[id] = v),\n                  ),\n                ),\n                const SizedBox(width: 8),\n                Expanded(\n                  child: _quantityField(\n                    label: 'Returned',\n                    value: returned,\n                    max: loaded,\n                    onChanged: (v) => setState(() => _returned[id] = v),\n                  ),\n                ),\n              ],\n            ),\n            const SizedBox(height: 10),\n            Row(\n              children: [\n                Expanded(\n                  child: TextFormField(\n                    initialValue: discount.toStringAsFixed(2),\n                    key: ValueKey('discount-$id-$discount'),\n                    keyboardType: const TextInputType.numberWithOptions(decimal: true),\n                    decoration: const InputDecoration(\n                      labelText: 'Product discount %',\n                      suffixText: '%',\n                      border: OutlineInputBorder(),\n                    ),\n                    onChanged: (value) {\n                      final parsed = double.tryParse(value);\n                      if (parsed == null) return;\n                      setState(() => _discounts[id] = parsed.clamp(0, 100).toDouble());\n                    },\n                  ),\n                ),\n                const SizedBox(width: 10),\n                Expanded(\n                  child: Column(\n                    crossAxisAlignment: CrossAxisAlignment.end,\n                    children: [\n                      Text('$sold sold', style: const TextStyle(fontWeight: FontWeight.w900)),\n                      const SizedBox(height: 3),\n                      Text(\n                        _money(line.netValue),\n                        style: TextStyle(color: scheme.primary, fontWeight: FontWeight.w900),\n                      ),\n                    ],\n                  ),\n                ),\n              ],\n            ),\n          ],\n        ),\n      ),\n    );\n  }\n\n'''
              quantity = '''  Widget _quantityField({\n    required String label,\n    required int value,\n    required ValueChanged<int> onChanged,\n    int? max,\n  }) {\n    final cappedMax = max ?? 1000000;\n    return Row(\n      children: [\n        IconButton(\n          onPressed: value <= 0 ? null : () => onChanged(value - 1),\n          icon: const Icon(Icons.remove_circle_outline_rounded),\n        ),\n        Expanded(\n          child: TextFormField(\n            key: ValueKey('$label-$value'),\n            initialValue: '$value',\n            textAlign: TextAlign.center,\n            keyboardType: TextInputType.number,\n            decoration: InputDecoration(labelText: label, border: const OutlineInputBorder()),\n            onChanged: (raw) {\n              final parsed = int.tryParse(raw);\n              if (parsed == null) return;\n              onChanged(parsed.clamp(0, cappedMax).toInt());\n            },\n          ),\n        ),\n        IconButton(\n          onPressed: value >= cappedMax ? null : () => onChanged(value + 1),\n          icon: const Icon(Icons.add_circle_outline_rounded),\n        ),\n      ],\n    );\n  }\n\n'''
              t = t[:product_start] + product + quantity + t[discount_start:]
              return t

          edit('lib/features/car/presentation/car_trip_editor_page.dart', repair_editor)

          def repair_animation(t: str) -> str:
              return t.replace(').clamp(0, widget.allocations.length) as int;', ').clamp(0, widget.allocations.length).toInt();')
          edit('lib/features/car/presentation/animations/payment_distribution_animation.dart', repair_animation)

          def repair_local_car(t: str) -> str:
              t = t.replace("if (closedCount) closedCount++; else openCount++;", "if (closedCount) {\n        closedCount++;\n      } else {\n        openCount++;\n      }")
              t = t.replace("if (view.status.value == 'closed') closedCount++; else openCount++;", "if (view.status.value == 'closed') {\n        closedCount++;\n      } else {\n        openCount++;\n      }")
              return t
          edit('lib/features/car/data/local_car_repository.dart', repair_local_car)

          def remove_unused_element(t: str) -> str:
              return re.sub(r"\n\s*bool isNotUsed\(.*?\n\s*}\n", '\n', t, count=1, flags=re.S)
          edit('lib/features/car/presentation/car_trip_details_page.dart', remove_unused_element)
          PY

      - name: Commit autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No autofixes to commit."
          else
            git commit -m "chore(ci): apply Car compile fixes [car-autofix]"
            git pull --rebase origin refactor/car-architecture
            git push origin HEAD:refactor/car-architecture
          fi

      - name: Analysis report
        continue-on-error: true
        run: flutter analyze
