name: Car Autofix

on:
  push:
    branches: [refactor/car-architecture]

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[car-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply Dart mechanical fixes
        run: dart fix --apply

      - name: Apply Car compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))

          replace(
              'lib/features/car/presentation/car_trip_editor_page.dart',
              "const ListTile(title: Text('Add product', subtitle: Text('Select a product for this Car load'))),",
              "const ListTile(title: Text('Add product'), subtitle: Text('Select a product for this Car load')),",
          )

          replace(
              'lib/features/car/presentation/car_trips_page.dart',
              'if (trip.remaining == 0)',
              'if (trip.remaining.minorUnits == 0)',
          )

          p = Path('lib/features/car/data/local_car_repository.dart')
          text = p.read_text()
          old = """      overdueCount: overdueCount,\n    );"""
          new = """      overdueCount: overdueCount,\n      totalReturnedValue: CarMoney(returnedValue),\n    );"""
          if old in text and 'totalReturnedValue:' not in text:
              text = text.replace(old, new, 1)
          old_revision = """      triggeredBy: triggeredBy,\n      status: trip.status,"""
          new_revision = """      triggeredBy: triggeredBy,\n      salesCarId: trip.salesCarId,\n      salesCarName: trip.salesCarName,\n      warehouseId: trip.warehouseId,\n      warehouseName: trip.warehouseName,\n      status: trip.status,"""
          if old_revision in text:
              text = text.replace(old_revision, new_revision, 1)
          p.write_text(text)

          p = Path('lib/features/car/presentation/animations/payment_distribution_animation.dart')
          text = p.read_text()
          text = text.replace(
              'progress: ((_flow.value * widget.allocations.length) - i).clamp(0, 1),',
              'progress: ((_flow.value * widget.allocations.length) - i).clamp(0.0, 1.0),',
          )
          p.write_text(text)
          PY

      - name: Commit autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No autofixes to commit."
          else
            git commit -m "chore(ci): apply Car compile fixes [car-autofix]"
            git push
          fi

      - name: Analysis report
        continue-on-error: true
        run: flutter analyze
