name: Deep function and SQL profile

on:
  push:
    branches: [perf/async-db-admission]
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "4"
      DB_POOL_MAX_SIZE: "8"
      ASYNC_DB_CONCURRENCY: "4"
      ASYNC_DB_ADMISSION_TIMEOUT_MS: "0"
      PERF_TIMING_ENABLED: "true"
      DEEP_PROFILE_ENABLED: "true"
      DEEP_PROFILE_DIR: "benchmark-results/deep-profile"
      BENCH_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx yappi
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py
      - name: Configure PostgreSQL diagnostics
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements';"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 60); do
            PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "SELECT 1" >/dev/null 2>&1 && break
            sleep 1
          done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "SELECT pg_stat_statements_reset();"
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "ANALYZE;"
      - name: Start isolated API worker
        run: |
          set -euo pipefail
          mkdir -p benchmark-results/deep-profile
          gunicorn core.asgi:application --bind 127.0.0.1:8000 --workers 1 --worker-class uvicorn_worker.UvicornWorker --timeout 30 --access-logfile /dev/null --error-logfile /tmp/gunicorn-deep.log --log-level warning &
          echo $! > /tmp/gunicorn-deep.pid
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/gunicorn-deep.log || true
          exit 1
      - name: Deep wall-clock function profile
        run: |
          set -euo pipefail
          TOKEN="$(cat bench_token.txt)"
          BENCH_URL="http://127.0.0.1:8000/api/v1/products/?page=1&page_size=20" \
          BENCH_TOKEN="$TOKEN" DEEP_PROFILE_KIND=wall DEEP_PROFILE_WARMUP=10 \
            python benchmarks/deep_profile_http.py | tee benchmark-results/deep-profile/wall-driver.txt
      - name: Collect wall SQL statistics
        run: |
          set -euo pipefail
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -At -F $'\t' \
            -c "SELECT calls, total_exec_time, mean_exec_time, rows, shared_blks_hit, shared_blks_read, left(query, 2000) FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 50;" \
            > benchmark-results/deep-profile/pg-stat-wall.tsv
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "SELECT pg_stat_statements_reset();"
      - name: Deep CPU function profile
        run: |
          set -euo pipefail
          TOKEN="$(cat bench_token.txt)"
          BENCH_URL="http://127.0.0.1:8000/api/v1/products/?page=1&page_size=20" \
          BENCH_TOKEN="$TOKEN" DEEP_PROFILE_KIND=cpu DEEP_PROFILE_WARMUP=10 \
            python benchmarks/deep_profile_http.py | tee benchmark-results/deep-profile/cpu-driver.txt
      - name: Collect CPU SQL statistics
        run: |
          set -euo pipefail
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -At -F $'\t' \
            -c "SELECT calls, total_exec_time, mean_exec_time, rows, shared_blks_hit, shared_blks_read, left(query, 2000) FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 50;" \
            > benchmark-results/deep-profile/pg-stat-cpu.tsv
      - name: Per-node PostgreSQL plan
        run: |
          python benchmarks/postgres_diagnostics.py > benchmark-results/deep-profile/postgres-plan-timing.json
      - name: Build deep profile report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("benchmark-results/deep-profile")
          lines = [
              "# Deep function / SQL profile",
              "",
              "The wall profile is coroutine-aware; Yappi exposes per-function total time (`ttot`), self time (`tsub`), call count, and supports wall or CPU clocks. Framework and project functions are retained, with project rows highlighted by the `project` flag.",
              "",
          ]

          for kind in ("wall", "cpu"):
              files = sorted(root.glob(f"{kind}-*.json"))
              if not files:
                  continue
              data = json.loads(files[0].read_text())
              rows = [x for x in data["functions"] if x["project"]]
              rows.sort(key=lambda x: x["ttot_ms"], reverse=True)
              lines += [f"## {kind.upper()} profile", "", f"Profile duration: {data['duration_ms']:.3f} ms", "", "| Function | Calls | Total ms | Self ms | Avg ms | Module |", "|---|---:|---:|---:|---:|---|"]
              for row in rows[:100]:
                  lines.append(f"| `{row['full_name']}` | {row['ncall']} | {row['ttot_ms']:.3f} | {row['tsub_ms']:.3f} | {row['tavg_ms']:.3f} | `{row['module']}` |")
              lines.append("")

              sql_rows = sorted(data.get("sql", []), key=lambda x: x["total_ms"], reverse=True)
              lines += [f"### {kind.upper()} SQL captured by Python cursor wrapper", "", "| Caller | Calls | Total ms | Mean ms | Max ms | SQL |", "|---|---:|---:|---:|---:|---|"]
              for row in sql_rows[:50]:
                  sql = row["sql"].replace("|", "\\|")[:300]
                  caller = row["caller"]["function"] if row.get("caller") else "<unknown>"
                  lines.append(f"| `{caller}` | {row['count']} | {row['total_ms']:.3f} | {row['mean_ms']:.3f} | {row['max_ms']:.3f} | `{sql}` |")
              lines.append("")

          (root / "deep-profile-report.md").write_text("\n".join(lines) + "\n")
          PY
      - name: Stop API
        if: always()
        run: |
          if [[ -f /tmp/gunicorn-deep.pid ]]; then
            PID="$(cat /tmp/gunicorn-deep.pid)"
            kill "$PID" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              kill -0 "$PID" 2>/dev/null || exit 0
              sleep 1
            done
            kill -KILL "$PID" 2>/dev/null || true
          fi
      - name: Upload deep profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-function-sql-profile
          path: erp-api/benchmark-results/deep-profile/
          if-no-files-found: warn
