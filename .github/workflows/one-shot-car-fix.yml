name: One Shot Car Fix

on:
  push:
    branches: [refactor/car-architecture]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[one-shot-car-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Rewrite parser-sensitive editor block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/features/car/presentation/car_trip_editor_page.dart')
          t = p.read_text()

          start = t.index('  Widget _buildDiscountSection()')
          end = t.index('  String _formatDate', start)

          replacement = '''  Widget _buildDiscountSection() {\n    final scheme = Theme.of(context).colorScheme;\n    return Card(\n      child: Padding(\n        padding: const EdgeInsets.all(16),\n        child: Row(\n          children: [\n            Expanded(\n              child: TextFormField(\n                controller: _globalDiscountController,\n                keyboardType: const TextInputType.numberWithOptions(decimal: true),\n                decoration: const InputDecoration(\n                  labelText: 'Global discount %',\n                  suffixText: '%',\n                  border: OutlineInputBorder(),\n                ),\n                onChanged: (raw) {\n                  final parsed = double.tryParse(raw);\n                  if (parsed == null) return;\n                  setState(() => _globalDiscountPercent = parsed.clamp(0, 100).toDouble());\n                },\n              ),\n            ),\n            const SizedBox(width: 14),\n            Expanded(\n              child: Text(\n                'Applied after all product-level discounts.',\n                style: TextStyle(color: scheme.onSurfaceVariant, fontSize: 12),\n              ),\n            ),\n          ],\n        ),\n      ),\n    );\n  }\n\n  Widget _buildSummary() {\n    final scheme = Theme.of(context).colorScheme;\n    if (_selectedProductIds.isEmpty) return const SizedBox.shrink();\n\n    final summary = _calculator.summary(_buildTrip(closed: false));\n    return Column(\n      crossAxisAlignment: CrossAxisAlignment.start,\n      children: [\n        Text('Calculation summary', style: Theme.of(context).textTheme.titleLarge),\n        const SizedBox(height: 10),\n        GridView.count(\n          crossAxisCount: 2,\n          shrinkWrap: true,\n          physics: const NeverScrollableScrollPhysics(),\n          crossAxisSpacing: 8,\n          mainAxisSpacing: 8,\n          childAspectRatio: 2.3,\n          children: [\n            CarMetricCard(label: 'Loaded cartons', value: '${summary.totalLoadedCartons}', icon: Icons.outbox_rounded),\n            CarMetricCard(label: 'Returned cartons', value: '${summary.totalReturnedCartons}', icon: Icons.assignment_return_rounded),\n            CarMetricCard(label: 'Sold cartons', value: '${summary.totalSoldCartons}', icon: Icons.point_of_sale_rounded),\n            CarMetricCard(label: 'Gross sold value', value: _money(summary.grossSubtotal), icon: Icons.receipt_long_outlined),\n          ],\n        ),\n        const SizedBox(height: 10),\n        Card(\n          child: Padding(\n            padding: const EdgeInsets.all(16),\n            child: Column(\n              children: [\n                _summaryRow('Product discounts', summary.productDiscountTotal, false),\n                _summaryRow('After product discounts', summary.subtotalAfterProducts, false),\n                _summaryRow('Global discount', summary.globalDiscountAmount, false),\n                const Divider(height: 22),\n                Row(\n                  mainAxisAlignment: MainAxisAlignment.spaceBetween,\n                  children: [\n                    const Text('Actual sold value', style: TextStyle(fontSize: 17, fontWeight: FontWeight.w900)),\n                    Text(\n                      _money(summary.finalTotalSoldValue),\n                      style: TextStyle(fontSize: 19, fontWeight: FontWeight.w900, color: scheme.primary),\n                    ),\n                  ],\n                ),\n              ],\n            ),\n          ),\n        ),\n      ],\n    );\n  }\n\n  Widget _summaryRow(String label, CarMoney amount, bool accent) {\n    return Padding(\n      padding: const EdgeInsets.symmetric(vertical: 3),\n      child: Row(\n        mainAxisAlignment: MainAxisAlignment.spaceBetween,\n        children: [\n          Text(label),\n          Text(\n            _money(amount),\n            style: TextStyle(\n              fontWeight: FontWeight.w700,\n              color: accent ? Theme.of(context).colorScheme.primary : null,\n            ),\n          ),\n        ],\n      ),\n    );\n  }\n\n'''

          t = t[:start] + replacement + t[end:]
          t = re.sub(r"\n\s*bool isNotUsed\(.*?\n\s*}\n", "\n", t, count=1, flags=re.S)
          p.write_text(t)
          PY
      - name: Format
        run: dart format lib/features/car/presentation/car_trip_editor_page.dart lib/features/car/presentation/car_trip_details_page.dart
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): apply one-shot Car parser fix [one-shot-car-fix]" || true
          git pull --rebase origin refactor/car-architecture
          git push origin HEAD:refactor/car-architecture
