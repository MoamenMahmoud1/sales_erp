name: One Shot Lint Fix

on:
  push:
    branches: [refactor/car-architecture]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old!r}')
              p.write_text(text.replace(old, new))

          replace(
              'lib/features/car/presentation/car_trip_details_page.dart',
              """    if (mounted)\n      setState(() {\n        _loading = true;\n        _error = null;\n      });\n    try {""",
              """    if (mounted) {\n      setState(() {\n        _loading = true;\n        _error = null;\n      });\n    }\n    try {""",
          )
          replace(
              'lib/features/car/presentation/car_trip_details_page.dart',
              """    if (_loading)\n      return const Scaffold(body: Center(child: CircularProgressIndicator()));\n    final trip = _trip;""",
              """    if (_loading) {\n      return const Scaffold(body: Center(child: CircularProgressIndicator()));\n    }\n    final trip = _trip;""",
          )
          replace(
              'lib/features/car/presentation/car_trip_details_page.dart',
              """\nextension on CarTripSummaryView {\n  bool get isNotUsed => false;\n}\n""",
              "\n",
          )

          replace(
              'lib/features/car/presentation/car_trip_editor_page.dart',
              """      if (mounted)\n        ScaffoldMessenger.of(context)\n            .showSnackBar(SnackBar(content: Text('$error')));""",
              """      if (mounted) {\n        ScaffoldMessenger.of(context)\n            .showSnackBar(SnackBar(content: Text('$error')));\n      }""",
          )
          replace(
              'lib/features/car/presentation/car_trip_editor_page.dart',
              """    if (_loading)\n      return const Scaffold(body: Center(child: CircularProgressIndicator()));\n    if (_error != null) {""",
              """    if (_loading) {\n      return const Scaffold(body: Center(child: CircularProgressIndicator()));\n    }\n    if (_error != null) {""",
          )
          # The editor contains the same catch shape twice; patch any remaining copy.
          p = Path('lib/features/car/presentation/car_trip_editor_page.dart')
          text = p.read_text()
          old = """      if (mounted)\n        ScaffoldMessenger.of(context)\n            .showSnackBar(SnackBar(content: Text('$error')));"""
          new = """      if (mounted) {\n        ScaffoldMessenger.of(context)\n            .showSnackBar(SnackBar(content: Text('$error')));\n      }"""
          text = text.replace(old, new)
          p.write_text(text)
          PY
      - name: Format touched files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dart 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): apply lint fixes [lint-fix]" || true
          git pull --rebase origin refactor/car-architecture
          git push origin HEAD:refactor/car-architecture
