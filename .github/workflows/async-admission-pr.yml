name: Async DB Admission Benchmark (PR)

on:
  push:
    branches: [perf/async-db-admission]
  pull_request:
    branches: [main]
    paths:
      - "erp-api/common/services/async_db_gate.py"
      - "erp-api/products/api/views.py"
      - "erp-api/benchmarks/**"
      - "erp-api/core/settings/settings_bench.py"
      - ".github/workflows/async-admission-pr.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "10"
      WEB_CONCURRENCY: "2"
      TRUST_PROXY_HEADERS: "false"
      BENCH_TIMEOUT: "10"
      BENCH_DEADLINE: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py
      - name: Configure PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 60); do
            if PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "ANALYZE;"
      - name: Run admission matrix
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          TOKEN="$(cat bench_token.txt)"
          URL="http://127.0.0.1:8000/api/v1/products/?page=1&page_size=20"
          SERVER_PID=""
          start_server() {
            local gate="$1"
            export BENCH_API_STACK=async
            export BENCH_MINIMAL_MIDDLEWARE=0
            export BENCH_MIDDLEWARE_DIAGNOSTIC=1
            export BENCH_MIDDLEWARE_EXCLUDE=""
            export ASYNC_DB_CONCURRENCY="$gate"
            gunicorn core.asgi:application --bind 127.0.0.1:8000 --workers 2 --worker-class uvicorn_worker.UvicornWorker --timeout 30 --access-logfile /dev/null --error-logfile /tmp/gunicorn-admission.log --log-level warning &
            SERVER_PID=$!
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1; then return; fi
              sleep 1
            done
            cat /tmp/gunicorn-admission.log || true
            exit 1
          }
          stop_server() {
            if [[ -n "${SERVER_PID:-}" ]] && kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" || true
              wait "$SERVER_PID" || true
            fi
            SERVER_PID=""
          }
          trap stop_server EXIT
          run_case() {
            local case_name="$1"
            local concurrency="$2"
            local requests="$3"
            BENCH_URL="$URL" BENCH_TOKEN="$TOKEN" BENCH_CASE="$case_name" BENCH_CONCURRENCY="$concurrency" BENCH_REQUESTS="$requests" BENCH_WARMUP=50 BENCH_DEADLINE=90 BENCH_TIMEOUT=10 python benchmarks/middleware_diagnostic.py > "benchmark-results/${case_name}.json"
          }
          for gate in 0 4 5 6; do
            start_server "$gate"
            run_case "gate${gate}-c50" 50 300
            stop_server
            start_server "$gate"
            run_case "gate${gate}-c100" 100 300
            stop_server
          done
      - name: Build report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("benchmark-results")
          cases=[]
          for p in sorted(root.glob("gate*.json")):
              try:
                  cases.append(json.loads(p.read_text()))
              except Exception:
                  pass
          def f(v):
              return "" if v is None else f"{v:.3f}"
          out=[
            "# Async DB admission benchmark",
            "",
            "| case | concurrency | p50 | p95 | p99 | server p50 | db p50 | pool p50 | gate p50 | successful | failed | complete |",
            "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|",
          ]
          for c in cases:
              out.append(f"| {c.get('case')} | {c.get('concurrency')} | {f(c.get('p50_ms'))} | {f(c.get('p95_ms'))} | {f(c.get('p99_ms'))} | {f(c.get('server_p50_ms'))} | {f(c.get('db_p50_ms'))} | {f(c.get('pool_p50_ms'))} | {f(c.get('gate_p50_ms'))} | {c.get('successful')} | {c.get('failed')} | {c.get('complete')} |")
          (root/"report.md").write_text("\n".join(out)+"\n")
          (root/"report.json").write_text(json.dumps(cases,indent=2,sort_keys=True))
          PY
      - name: Add benchmark summary
        run: cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: async-db-admission-benchmark
          path: erp-api/benchmark-results/
          if-no-files-found: error
