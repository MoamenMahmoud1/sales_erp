name: Async DB Admission Benchmark (PR)

on:
  push:
    branches: [perf/async-db-admission]
  pull_request:
    branches: [main]
    paths:
      - "erp-api/common/services/async_db_gate.py"
      - "erp-api/products/api/views.py"
      - "erp-api/benchmarks/**"
      - "erp-api/core/settings/settings_bench.py"
      - "erp-api/core/settings/settings_prod.py"
      - "erp-api/gunicorn.conf.py"
      - ".github/workflows/async-admission-pr.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: erp-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "5"
      WEB_CONCURRENCY: "4"
      TRUST_PROXY_HEADERS: "false"
      BENCH_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx
      - name: Django tests
        run: python manage.py test
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py
      - name: Configure PostgreSQL diagnostics
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements';"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 60); do
            if PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "SELECT pg_stat_statements_reset();"
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "ANALYZE;"
      - name: Start API
        run: |
          set -euo pipefail
          export ASYNC_DB_CONCURRENCY=0
          gunicorn core.asgi:application --bind 127.0.0.1:8000 --workers "$WEB_CONCURRENCY" --worker-class uvicorn_worker.UvicornWorker --timeout 30 --access-logfile /dev/null --error-logfile /tmp/gunicorn-admission.log --log-level warning &
          echo $! > /tmp/gunicorn.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/gunicorn-admission.log || true
          exit 1
      - name: Benchmark baseline
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          TOKEN="$(cat bench_token.txt)"
          URL="http://127.0.0.1:8000/api/v1/products/?page=1&page_size=20"
          for concurrency in 50 100; do
            BENCH_URL="$URL" BENCH_TOKEN="$TOKEN" BENCH_CONCURRENCY="$concurrency" BENCH_REQUESTS=500 BENCH_WARMUP=100 BENCH_TIMEOUT=10 python benchmarks/http_benchmark.py > "benchmark-results/baseline-c${concurrency}.json"
          done
      - name: Benchmark admission limits
        run: |
          set -euo pipefail
          TOKEN="$(cat bench_token.txt)"
          URL="http://127.0.0.1:8000/api/v1/products/?page=1&page_size=20"
          for gate in 3 4 5; do
            OLD_PID="$(cat /tmp/gunicorn.pid 2>/dev/null || true)"
            if [[ -n "$OLD_PID" ]] && kill -0 "$OLD_PID" 2>/dev/null; then
              kill "$OLD_PID" 2>/dev/null || true
              for attempt in $(seq 1 30); do
                kill -0 "$OLD_PID" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$OLD_PID" 2>/dev/null; then kill -KILL "$OLD_PID" 2>/dev/null || true; fi
            fi
            ASYNC_DB_CONCURRENCY="$gate" gunicorn core.asgi:application --bind 127.0.0.1:8000 --workers "$WEB_CONCURRENCY" --worker-class uvicorn_worker.UvicornWorker --timeout 30 --access-logfile /dev/null --error-logfile /tmp/gunicorn-admission.log --log-level warning &
            echo $! > /tmp/gunicorn.pid
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1; then break; fi
              sleep 1
            done
            if ! curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1; then cat /tmp/gunicorn-admission.log || true; exit 1; fi
            for concurrency in 50 100; do
              BENCH_URL="$URL" BENCH_TOKEN="$TOKEN" BENCH_CONCURRENCY="$concurrency" BENCH_REQUESTS=500 BENCH_WARMUP=100 BENCH_TIMEOUT=10 python benchmarks/http_benchmark.py > "benchmark-results/gate${gate}-c${concurrency}.json"
            done
          done
      - name: PostgreSQL query diagnostics
        run: |
          set -euo pipefail
          python benchmarks/postgres_diagnostics.py > benchmark-results/postgres-plan.json
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -At -F $'\t' -c "SELECT calls, total_exec_time, mean_exec_time, rows, shared_blks_hit, shared_blks_read, left(query, 1000) FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 30;" > benchmark-results/pg-stat-statements.tsv
      - name: Stop API
        if: always()
        run: |
          if [[ -f /tmp/gunicorn.pid ]]; then
            PID="$(cat /tmp/gunicorn.pid)"
            kill "$PID" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              kill -0 "$PID" 2>/dev/null || exit 0
              sleep 1
            done
            kill -KILL "$PID" 2>/dev/null || true
          fi
      - name: Build report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("benchmark-results")
          rows = []
          for p in sorted(root.glob("*.json")):
              if p.name == "postgres-plan.json":
                  continue
              case = json.loads(p.read_text())
              rps = case.get("rps", case.get("successful_rps", 0))
              rows.append(
                  f"| {p.stem} | {case['concurrency']} | {case.get('latency_mean_ms', 0):.2f} | "
                  f"{case['p50_ms']:.2f} | {case['p95_ms']:.2f} | {case['p99_ms']:.2f} | {rps:.2f} | "
                  f"{case['successful']} | {case['failed']} |"
              )

          report = [
              "# Async DB admission benchmark", "",
              "HTTP latency is measured entirely outside Django. No request timing middleware, SQL wrappers, ContextVars, response timing headers, or per-request benchmark state are enabled.", "",
              "| case | concurrency | mean ms | p50 ms | p95 ms | p99 ms | RPS | successful | failed |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|", *rows, "",
              "PostgreSQL execution plans and pg_stat_statements are included in the uploaded artifact for root-cause analysis.",
          ]
          (root / "report.md").write_text("\n".join(report) + "\n")
          PY
      - name: Add benchmark summary
        if: always()
        run: cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-db-admission-benchmark
          path: erp-api/benchmark-results/
          if-no-files-found: warn
