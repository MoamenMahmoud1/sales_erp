name: Product endpoint performance benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "erp-api/common/services/async_db_gate.py"
      - "erp-api/products/api/views.py"
      - "erp-api/products/api/sync_views.py"
      - "erp-api/products/services/**"
      - "erp-api/common/pagination/**"
      - "erp-api/benchmarks/**"
      - "erp-api/core/settings/settings_bench.py"
      - "erp-api/core/settings/settings_prod.py"
      - "erp-api/gunicorn.conf.py"
      - ".github/workflows/async-admission-pr.yml"
  workflow_dispatch:

concurrency:
  group: product-endpoint-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: erp-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "4"
      DB_POOL_MAX_SIZE: "8"
      ASYNC_DB_CONCURRENCY: "4"
      WEB_CONCURRENCY: "4"
      TRUST_PROXY_HEADERS: "false"
      ASYNC_DB_ADMISSION_TIMEOUT_MS: "0"
      BENCH_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py

      - name: Configure PostgreSQL diagnostics
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements';"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 60); do
            if PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "SELECT pg_stat_statements_reset();"
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "ANALYZE;"

      - name: Benchmark async and sync stacks
        run: |
          set -euo pipefail
          rm -rf benchmark-results
          mkdir -p benchmark-results
          TOKEN="$(cat bench_token.txt)"
          URL="http://127.0.0.1:8000/api/v1/products/?page=1&page_size=20"
          FAILED_CASES=()

          stop_server() {
            local pid="$(cat /tmp/gunicorn.pid 2>/dev/null || true)"
            if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
              for attempt in $(seq 1 40); do
                if ! kill -0 "$pid" 2>/dev/null; then break; fi
                sleep 0.25
              done
              kill -KILL -- "-$pid" 2>/dev/null || true
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f /tmp/gunicorn.pid

            for attempt in $(seq 1 40); do
              if ! ss -ltnH 'sport = :8000' | grep -q .; then return 0; fi
              sleep 0.25
            done

            echo "port 8000 is still occupied after server shutdown" >&2
            ss -ltnp || true
            ps -ef --forest | grep -E 'gunicorn|uvicorn' | grep -v grep || true
            return 1
          }

          start_server() {
            local stack="$1"
            local pagination="$2"

            stop_server
            : > /tmp/gunicorn-benchmark.log

            if [[ "$stack" == "sync" ]]; then
              setsid env BENCH_API_STACK=sync BENCH_PAGINATION="$pagination" \
                gunicorn core.wsgi:application --bind 127.0.0.1:8000 \
                --workers "$WEB_CONCURRENCY" --worker-class sync \
                --timeout 30 --access-logfile /dev/null \
                --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            else
              setsid env BENCH_API_STACK=async BENCH_PAGINATION="$pagination" \
                gunicorn core.asgi:application --bind 127.0.0.1:8000 \
                --workers "$WEB_CONCURRENCY" --worker-class uvicorn_worker.UvicornWorker \
                --timeout 30 --access-logfile /dev/null \
                --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            fi

            echo $! > /tmp/gunicorn.pid

            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1; then return 0; fi
              if [[ -s /tmp/gunicorn-benchmark.log ]] && grep -qiE 'error|traceback|failed|address already in use' /tmp/gunicorn-benchmark.log; then break; fi
              sleep 1
            done

            echo "server failed to become healthy: stack=$stack pagination=$pagination" >&2
            echo "--- gunicorn log ---" >&2
            cat /tmp/gunicorn-benchmark.log >&2 || true
            echo "--- port state ---" >&2
            ss -ltnp || true
            echo "--- process state ---" >&2
            ps -ef --forest | grep -E 'gunicorn|uvicorn' | grep -v grep || true
            return 1
          }

          bench_case() {
            local stack="$1"
            local pagination="$2"
            local concurrency="$3"
            local prefix="${stack}-${pagination}-c${concurrency}"

            set +e
            BENCH_MODE="$stack" BENCH_PAGINATION="$pagination" BENCH_URL="$URL" BENCH_TOKEN="$TOKEN" \
              BENCH_CONCURRENCY="$concurrency" BENCH_REQUESTS=500 BENCH_WARMUP=100 BENCH_TIMEOUT=10 \
              BENCH_DETAIL_PATH="benchmark-results/${prefix}-requests.ndjson" \
              python benchmarks/http_benchmark.py | tee "benchmark-results/${prefix}.json"
            local rc=${PIPESTATUS[0]}
            set -e

            if [[ "$rc" -ne 0 ]]; then
              FAILED_CASES+=("$prefix")
              cp /tmp/gunicorn-benchmark.log "benchmark-results/${prefix}-server.log" 2>/dev/null || true
              echo "benchmark case returned non-zero: $prefix (rc=$rc)" >&2
            fi
          }

          for stack in async sync; do
            for pagination in page cursor; do
              for concurrency in 1 50 100; do
                if ! start_server "$stack" "$pagination"; then
                  prefix="${stack}-${pagination}-c${concurrency}"
                  FAILED_CASES+=("${prefix}-server-start")
                  cp /tmp/gunicorn-benchmark.log "benchmark-results/${prefix}-server.log" 2>/dev/null || true
                  continue
                fi
                bench_case "$stack" "$pagination" "$concurrency"
                stop_server
              done
            done
          done

          if ((${#FAILED_CASES[@]} > 0)); then
            printf '%s\n' "${FAILED_CASES[@]}" > benchmark-results/failed-cases.txt
          else
            : > benchmark-results/failed-cases.txt
          fi

      - name: PostgreSQL query diagnostics
        if: always()
        run: |
          set -euo pipefail
          python benchmarks/postgres_diagnostics.py > benchmark-results/postgres-plan.json
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -At -F $'\t' \
            -c "SELECT calls, total_exec_time, mean_exec_time, rows, shared_blks_hit, shared_blks_read, left(query, 1000) FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 30;" \
            > benchmark-results/pg-stat-statements.tsv

      - name: Build benchmark report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("benchmark-results")
          workers = int(os.environ.get("WEB_CONCURRENCY", "1"))
          async_db_concurrency = int(os.environ.get("ASYNC_DB_CONCURRENCY", "0"))
          effective_async_db_concurrency = workers * async_db_concurrency if async_db_concurrency > 0 else 0
          rows = []
          for p in sorted(root.glob("*.json")):
              if p.name in {"postgres-plan.json"}:
                  continue
              try:
                  case = json.loads(p.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  continue
              if not isinstance(case, dict) or "concurrency" not in case:
                  continue
              rows.append(
                  "| {case} | {mode} | {pagination} | {c} | {wall:.3f} | {rps:.2f} | "
                  "{mean:.2f} | {p50:.2f} | {p95:.2f} | {p99:.2f} | {db:.2f} | {pool:.2f} | {admit:.2f} | {ok} | {failed} |".format(
                      case=p.stem,
                      mode=case.get("mode", "unknown"),
                      pagination=case.get("pagination", "page"),
                      c=case.get("concurrency", 0),
                      wall=case.get("wall_time_sec", 0),
                      rps=case.get("successful_rps", 0),
                      mean=case.get("latency_mean_ms") or 0,
                      p50=case.get("p50_ms") or 0,
                      p95=case.get("p95_ms") or 0,
                      p99=case.get("p99_ms") or 0,
                      db=case.get("db_p50_ms") or 0,
                      pool=case.get("pool_wait_p50_ms") or 0,
                      admit=case.get("db_admission_p50_ms") or 0,
                      ok=case.get("successful", 0),
                      failed=case.get("failed", 0),
                  )
              )

          report = [
              "# Product endpoint performance benchmark",
              "",
              "Canonical matrix: true ASGI async vs true WSGI sync × page/cursor × C=1/50/100.",
              "Each case runs 500 measured requests after 100 warmup requests against a fresh server process.",
              "HTTP latency is measured from actual request dispatch/start to response completion. Client batch-queue/dispatch delay is intentionally excluded from latency metrics because it is a load-generator scheduling artifact, not server queue time.",
              "",
              f"- Gunicorn workers: `{workers}`",
              f"- Async DB admission per worker: `{async_db_concurrency}`",
              f"- Effective async DB admission capacity: `{effective_async_db_concurrency}` concurrent DB operations (`workers × per-worker gate`)" if effective_async_db_concurrency else "- Async DB admission: disabled",
              "",
              "| case | mode | pagination | C | wall s | RPS | mean ms | p50 | p95 | p99 | DB p50 | pool p50 | admission p50 | successful | failed |",
              "|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
              *rows,
              "",
              "### Metric definitions",
              "- **Wall / RPS:** measured batch completion time and completed successful requests per second. This is the primary throughput comparison.",
              "- **HTTP latency:** `request_start -> response_end`; this is the latency used for mean/p50/p95/p99.",
              "- **DB p50:** database operation time reported by the application.",
              "- **Pool p50:** time waiting for a PostgreSQL pool connection.",
              "- **Admission p50:** time waiting for the async DB admission semaphore. For async workers, the configured gate is per worker, so total capacity is `WEB_CONCURRENCY × ASYNC_DB_CONCURRENCY`.",
              "",
              "`*-requests.ndjson` contains one record per request, including request start/end offsets and server timing headers.",
              "`pg-stat-statements.tsv` and `postgres-plan.json` contain PostgreSQL execution diagnostics.",
              "",
          ]
          failed_file = root / "failed-cases.txt"
          report.append("## Failed cases")
          report.append("")
          failed = [line.strip() for line in failed_file.read_text(encoding="utf-8").splitlines() if line.strip()] if failed_file.exists() else []
          report.extend([f"- `{name}`" for name in failed] or ["- none"])
          (root / "report.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          PY

      - name: Add benchmark summary
        if: always()
        run: cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-endpoint-benchmark
          path: erp-api/benchmark-results/
          if-no-files-found: warn

      - name: Fail when benchmark cases failed
        if: always()
        run: |
          if [[ -s benchmark-results/failed-cases.txt ]]; then
            echo "Benchmark failures detected:" >&2
            cat benchmark-results/failed-cases.txt >&2
            exit 1
          fi
