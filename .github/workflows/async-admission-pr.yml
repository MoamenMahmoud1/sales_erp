name: Product endpoint performance benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "erp-api/common/services/async_db_gate.py"
      - "erp-api/products/api/views.py"
      - "erp-api/products/api/sync_views.py"
      - "erp-api/products/services/**"
      - "erp-api/common/pagination/**"
      - "erp-api/benchmarks/**"
      - "erp-api/core/settings/settings_bench.py"
      - "erp-api/core/settings/settings_prod.py"
      - "erp-api/gunicorn.conf.py"
      - ".github/workflows/async-admission-pr.yml"
  workflow_dispatch:

concurrency:
  group: product-endpoint-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: erp-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      WEB_CONCURRENCY: "4"
      DB_POOL_MIN_SIZE: "0"
      DB_POOL_MAX_SIZE: "8"
      ASYNC_DB_CONCURRENCY: "4"
      ASYNC_DB_ADMISSION_TIMEOUT_MS: "0"
      TRUST_PROXY_HEADERS: "false"
      PERF_TIMING_ENABLED: "1"
      BENCH_TIMEOUT: "10"
      BENCH_REQUESTS: "500"
      BENCH_WARMUP: "100"
      # 5 ms rejected every calibration case in the previous run because
      # normal pool checkout/startup overhead is included in this metric.
      BENCH_MAX_POOL_P95_MS: "50"
      BENCH_MAX_ERROR_RATE_PCT: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py

      - name: Configure PostgreSQL diagnostics
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements';"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 60); do
            if PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "SELECT pg_stat_statements_reset();"
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "ANALYZE;"

      - name: Run independent calibration and best-sustainable comparison
        run: |
          set -euo pipefail
          rm -rf benchmark-results
          mkdir -p benchmark-results/calibration/{async,sync}/{page,cursor} benchmark-results/final
          TOKEN="$(cat bench_token.txt)"
          CALIBRATION_D_PER_WORKER=(1 2 3 4 5 6 7 8)
          CLIENT_CONCURRENCIES=(1 25 50 100)
          FAILED_CASES=()

          url_for_pagination() {
            if [[ "$1" == "cursor" ]]; then
              printf '%s\n' 'http://127.0.0.1:8000/api/v1/products/?page_size=20'
            else
              printf '%s\n' 'http://127.0.0.1:8000/api/v1/products/?page=1&page_size=20'
            fi
          }

          stop_server() {
            local pid="$(cat /tmp/gunicorn.pid 2>/dev/null || true)"
            if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
              for _ in $(seq 1 40); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.25
              done
              kill -KILL -- "-$pid" 2>/dev/null || true
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f /tmp/gunicorn.pid
            for _ in $(seq 1 40); do
              if ! ss -ltnH 'sport = :8000' | grep -q .; then return 0; fi
              sleep 0.25
            done
            echo 'port 8000 is still occupied after server shutdown' >&2
            return 1
          }

          start_server() {
            local stack="$1" pagination="$2" d="$3"
            stop_server
            : > /tmp/gunicorn-benchmark.log
            if [[ "$stack" == "sync" ]]; then
              setsid env BENCH_API_STACK=sync BENCH_PAGINATION="$pagination" \
                DB_POOL_MIN_SIZE="$d" DB_POOL_MAX_SIZE="$d" ASYNC_DB_CONCURRENCY=0 \
                gunicorn core.wsgi:application --bind 127.0.0.1:8000 \
                --workers "$WEB_CONCURRENCY" --threads "$d" --worker-class gthread \
                --timeout 30 --access-logfile /dev/null \
                --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            else
              setsid env BENCH_API_STACK=async BENCH_PAGINATION="$pagination" \
                DB_POOL_MIN_SIZE="$d" DB_POOL_MAX_SIZE="$d" ASYNC_DB_CONCURRENCY="$d" \
                gunicorn core.asgi:application --bind 127.0.0.1:8000 \
                --workers "$WEB_CONCURRENCY" --worker-class uvicorn_worker.UvicornWorker \
                --timeout 30 --access-logfile /dev/null \
                --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            fi
            echo $! > /tmp/gunicorn.pid
            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "server failed: $stack/$pagination/D=$d" >&2
            cat /tmp/gunicorn-benchmark.log >&2 || true
            return 1
          }

          run_case() {
            local label="$1" stack="$2" pagination="$3" c="$4" output="$5" detail="$6"
            local url
            url="$(url_for_pagination "$pagination")"
            set +e
            BENCH_MODE="$stack" BENCH_PAGINATION="$pagination" BENCH_URL="$url" \
              BENCH_TOKEN="$TOKEN" BENCH_CONCURRENCY="$c" BENCH_REQUESTS="$BENCH_REQUESTS" \
              BENCH_WARMUP="$BENCH_WARMUP" BENCH_TIMEOUT="$BENCH_TIMEOUT" \
              BENCH_DETAIL_PATH="$detail" python benchmarks/http_benchmark.py | tee "$output"
            local rc=${PIPESTATUS[0]}
            set -e
            if [[ "$rc" -ne 0 ]]; then FAILED_CASES+=("$label"); fi
            return 0
          }

          echo '== Independent calibration: C=100 =='
          for stack in async sync; do
            for pagination in page cursor; do
              dir="benchmark-results/calibration/$stack/$pagination"
              for d in "${CALIBRATION_D_PER_WORKER[@]}"; do
                label="${stack}-cal-${pagination}-d${d}"
                if ! start_server "$stack" "$pagination" "$d"; then
                  FAILED_CASES+=("$label-server-start")
                  continue
                fi
                PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c 'SELECT pg_stat_statements_reset();' >/dev/null
                run_case "$label" "$stack" "$pagination" 100 \
                  "$dir/${stack}-cal-d${d}.json" "$dir/${stack}-cal-d${d}-requests.ndjson"
                PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -At -F $'\t' \
                  -c 'SELECT calls,total_exec_time,mean_exec_time,rows,shared_blks_hit,shared_blks_read,left(query,1000) FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;' \
                  > "$dir/${stack}-cal-d${d}-pgstat.tsv"
                stop_server
              done
              CALIBRATION_DIR="$dir" CALIBRATION_PREFIX="${stack}-cal" \
                CALIBRATION_LABEL="${stack^} ${pagination}" WEB_CONCURRENCY="$WEB_CONCURRENCY" \
                BENCH_MAX_POOL_P95_MS="$BENCH_MAX_POOL_P95_MS" \
                BENCH_MAX_ERROR_RATE_PCT="$BENCH_MAX_ERROR_RATE_PCT" \
                python benchmarks/select_db_budget.py | tee "$dir/selection.txt"
            done
          done

          declare -A BEST_D
          for stack in async sync; do
            for pagination in page cursor; do
              env_file="benchmark-results/calibration/$stack/$pagination/${stack}-cal-selected.env"
              test -f "$env_file"
              source "$env_file"
              BEST_D["${stack}-${pagination}"]="$DB_BUDGET_PER_WORKER"
            done
          done

          echo '== Final matrix: each stack at its own best healthy D =='
          for pagination in page cursor; do
            for c in "${CLIENT_CONCURRENCIES[@]}"; do
              if (( c % 2 == 0 )); then ORDER=(sync async); else ORDER=(async sync); fi
              for stack in "${ORDER[@]}"; do
                d="${BEST_D["${stack}-${pagination}"]}"
                prefix="${stack}-${pagination}-c${c}"
                if start_server "$stack" "$pagination" "$d"; then
                  run_case "$prefix" "$stack" "$pagination" "$c" \
                    "benchmark-results/final/${prefix}.json" \
                    "benchmark-results/final/${prefix}-requests.ndjson"
                  stop_server
                else
                  FAILED_CASES+=("$prefix-server-start")
                fi
              done
            done
          done

          if ((${#FAILED_CASES[@]})); then
            printf '%s\n' "${FAILED_CASES[@]}" > benchmark-results/failed-cases.txt
          else
            : > benchmark-results/failed-cases.txt
          fi

      - name: PostgreSQL query diagnostics
        if: always()
        run: |
          set -euo pipefail
          python benchmarks/postgres_diagnostics.py > benchmark-results/postgres-plan.json
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -At -F $'\t' \
            -c 'SELECT calls,total_exec_time,mean_exec_time,rows,shared_blks_hit,shared_blks_read,left(query,1000) FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 30;' \
            > benchmark-results/pg-stat-statements.tsv

      - name: Build benchmark report
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("benchmark-results")
          workers = int(os.environ.get("WEB_CONCURRENCY", "1"))

          def env(path):
              out = {}
              if path.exists():
                  for line in path.read_text().splitlines():
                      if "=" in line:
                          k, v = line.split("=", 1)
                          out[k] = v
              return out

          report = [
              "# Product endpoint performance benchmark", "",
              "`C` = offered client concurrency; `D` = per-worker DB admission/execution budget.",
              "C is allowed to exceed D so excess requests queue before DB access.",
              "Async and sync are calibrated independently; each final matrix uses its own fastest healthy D.",
              "", f"Workers: `{workers}`",
              f"Pool p95 guardrail: `<= {os.environ.get('BENCH_MAX_POOL_P95_MS', '50')} ms`", "",
              "## Selected D", "", "| stack | pagination | total D | per-worker D |", "|---|---|---:|---:|",
          ]
          for stack in ("async", "sync"):
              for pagination in ("page", "cursor"):
                  e = env(root / "calibration" / stack / pagination / f"{stack}-cal-selected.env")
                  report.append(f"| {stack} | {pagination} | {e.get('DB_BUDGET_TOTAL', 'n/a')} | {e.get('DB_BUDGET_PER_WORKER', 'n/a')} |")

          report += ["", "## Final results", "", "| case | mode | pagination | C | wall s | RPS | p50 ms | p95 ms | p99 ms | DB p95 | pool p95 | admission p95 | failed |", "|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|"]
          for p in sorted((root / "final").glob("*.json")):
              try: c = json.loads(p.read_text())
              except Exception: continue
              report.append("| {case} | {mode} | {pagination} | {C} | {wall:.3f} | {rps:.2f} | {p50:.2f} | {p95:.2f} | {p99:.2f} | {db:.2f} | {pool:.2f} | {adm:.2f} | {failed} |".format(
                  case=p.stem, mode=c.get("mode", "?"), pagination=c.get("pagination", "?"), C=c.get("concurrency", 0),
                  wall=float(c.get("wall_time_sec") or 0), rps=float(c.get("successful_rps") or 0), p50=float(c.get("p50_ms") or 0),
                  p95=float(c.get("p95_ms") or 0), p99=float(c.get("p99_ms") or 0), db=float(c.get("db_p95_ms") or 0),
                  pool=float(c.get("pool_wait_p95_ms") or 0), adm=float(c.get("db_admission_p95_ms") or 0), failed=c.get("failed", 0)))
          report += ["", "## Failed cases", ""]
          failed = root / "failed-cases.txt"
          if failed.exists() and failed.read_text().strip(): report.extend(f"- `{x}`" for x in failed.read_text().splitlines() if x)
          else: report.append("- none")
          (root / "report.md").write_text("\n".join(report) + "\n")
          PY

      - name: Add benchmark summary
        if: always()
        run: cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-performance-benchmark
          path: erp-api/benchmark-results
          if-no-files-found: error
          retention-days: 14

      - name: Fail if benchmark cases failed
        if: always()
        run: |
          if [[ -s benchmark-results/failed-cases.txt ]]; then
            echo 'Benchmark failures:' >&2
            cat benchmark-results/failed-cases.txt >&2
            exit 1
          fi
