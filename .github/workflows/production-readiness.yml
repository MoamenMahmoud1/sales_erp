name: Production Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration:
    name: Android API integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erp_e2e
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout mobile client
        uses: actions/checkout@v6

      - name: Checkout ERP API
        uses: actions/checkout@v6
        with:
          repository: MoamenMahmoud1/erp-api
          ref: production-readiness-e2e
          path: erp-api

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: erp-api/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: erp-api/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare backend E2E data
        working-directory: erp-api/backend
        env:
          DJANGO_SETTINGS_MODULE: core.settings.settings_dev
          SECRET_KEY: e2e-local-secret-key-not-for-production
          JWT_SIGNING_KEY: e2e-local-jwt-signing-key-not-for-production
          DB_NAME: erp_e2e
          DB_USER: erp
          DB_PASSWORD: erp
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/1
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo_data
          E2E_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$E2E_PASSWORD"
          python manage.py shell -c "from django.contrib.auth import get_user_model; User=get_user_model(); User.objects.create_superuser('e2e_admin','e2e@example.invalid','$E2E_PASSWORD')"
          printf 'E2E_PASSWORD=%s\n' "$E2E_PASSWORD" >> "$GITHUB_ENV"

      - name: Start backend
        working-directory: erp-api/backend
        env:
          DJANGO_SETTINGS_MODULE: core.settings.settings_dev
          SECRET_KEY: e2e-local-secret-key-not-for-production
          JWT_SIGNING_KEY: e2e-local-jwt-signing-key-not-for-production
          DB_NAME: erp_e2e
          DB_USER: erp
          DB_PASSWORD: erp
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/1
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 --noreload >/tmp/erp-api-mobile-e2e.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/erp-api-mobile-e2e.log
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze --no-fatal-infos

      - name: Run Android integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: >-
            timeout 300s flutter test integration_test/app_e2e_test.dart -d emulator-5554
            --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1
            --dart-define=E2E_PASSWORD=$E2E_PASSWORD
