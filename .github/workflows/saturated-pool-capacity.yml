name: Saturated DB Pool Sync vs Async

on:
  pull_request:
    branches: [main]
    paths:
      - "erp-api/products/**"
      - "erp-api/common/**"
      - "erp-api/core/settings/**"
      - "erp-api/benchmarks/**"
      - ".github/workflows/saturated-pool-capacity.yml"
  workflow_dispatch:

concurrency:
  group: saturated-db-pool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "12"
      DB_POOL_MAX_SIZE: "12"
      ASYNC_DB_CONCURRENCY: "11"
      ASYNC_DB_ADMISSION_TIMEOUT_MS: "250"
      ASYNC_BENCH_THREADS: "0"
      TRUST_PROXY_HEADERS: "false"
      PERF_TIMING_ENABLED: "0"
      BENCH_TIMEOUT: "5"
      BENCH_REQUESTS: "300"
      BENCH_WARMUP: "20"
      PRODUCT_LIST_CACHE_ENABLED: "0"
      PRODUCT_LIST_CACHE_TTL: "30"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py
      - name: Configure PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker restart "$PG_CONTAINER"
          for _ in $(seq 1 30); do
            PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c 'ANALYZE;'

      - name: Run full-pool fair benchmark
        run: |
          set -euo pipefail
          rm -rf benchmark-results-saturated
          mkdir -p benchmark-results-saturated/final benchmark-results-saturated/diagnostic
          TOKEN="$(cat bench_token.txt)"

          WORKERS=4
          SYNC_THREADS=11
          DB_POOL=12
          DB_SLOTS=11
          CLIENT_CONCURRENCIES=(1 10 50 100 250)
          PAGINATIONS=(page cursor)
          CACHE_MODES=(off hot)

          clear_redis_cache() {
            python - <<'PY'
          import os
          import redis
          redis.from_url(os.environ["REDIS_URL"]).flushdb()
          PY
          }

          stop_server() {
            local pid="$(cat /tmp/gunicorn-fair.pid 2>/dev/null || true)"
            if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
              for _ in $(seq 1 30); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.1
              done
              kill -KILL -- "-$pid" 2>/dev/null || true
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f /tmp/gunicorn-fair.pid
          }

          start_server() {
            local mode="$1" pagination="$2" perf="$3" cache_mode="$4"
            local cache_enabled=0
            [[ "$cache_mode" == "hot" ]] && cache_enabled=1
            stop_server
            clear_redis_cache
            : > /tmp/gunicorn-fair.log

            if [[ "$mode" == "sync" ]]; then
              setsid env \
                BENCH_API_STACK=sync \
                BENCH_PAGINATION="$pagination" \
                PERF_TIMING_ENABLED="$perf" \
                PRODUCT_LIST_CACHE_ENABLED="$cache_enabled" \
                ASYNC_BENCH_THREADS=0 \
                DB_POOL_MIN_SIZE="$DB_POOL" DB_POOL_MAX_SIZE="$DB_POOL" ASYNC_DB_CONCURRENCY=0 \
                gunicorn core.wsgi:application \
                --bind 127.0.0.1:8000 \
                --workers "$WORKERS" \
                --threads "$SYNC_THREADS" \
                --worker-class gthread \
                --timeout 15 \
                --access-logfile /dev/null \
                --error-logfile /tmp/gunicorn-fair.log \
                --log-level warning &
            else
              setsid env \
                BENCH_API_STACK=async \
                BENCH_PAGINATION="$pagination" \
                PERF_TIMING_ENABLED="$perf" \
                PRODUCT_LIST_CACHE_ENABLED="$cache_enabled" \
                ASYNC_BENCH_THREADS=0 \
                DB_POOL_MIN_SIZE="$DB_POOL" DB_POOL_MAX_SIZE="$DB_POOL" ASYNC_DB_CONCURRENCY="$DB_SLOTS" \
                gunicorn core.asgi:application \
                --bind 127.0.0.1:8000 \
                --workers "$WORKERS" \
                --worker-class uvicorn_worker.UvicornWorker \
                --timeout 15 \
                --access-logfile /dev/null \
                --error-logfile /tmp/gunicorn-fair.log \
                --log-level warning &
            fi

            echo $! > /tmp/gunicorn-fair.pid
            for _ in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1 && return 0
              sleep 0.2
            done
            cat /tmp/gunicorn-fair.log >&2 || true
            return 1
          }

          sample_threads() {
            local pgid="$1" out="$2" max=0
            while kill -0 "$pgid" 2>/dev/null; do
              local current
              current="$(ps -eo pgid=,nlwp= | awk -v pg="$pgid" '$1==pg {sum+=$2} END {print sum+0}')"
              if [[ "$current" -gt "$max" ]]; then max="$current"; fi
              sleep 0.05
            done
            echo "$max" > "$out"
          }

          run_one() {
            local mode="$1" pagination="$2" c="$3" phase="$4" cache_mode="$5" perf="$6"
            local url="http://127.0.0.1:8000/api/v1/products/?page_size=20"
            local out="benchmark-results-saturated/$phase/${mode}-${pagination}-c${c}-${cache_mode}.json"
            local threads_out="${out%.json}.threads"
            local redis_cache=0
            [[ "$cache_mode" == "hot" ]] && redis_cache=1

            set +e
            sample_threads "$(cat /tmp/gunicorn-fair.pid)" "$threads_out" &
            local sampler_pid=$!

            timeout --signal=TERM --kill-after=5s 120s env \
              BENCH_MODE="$mode" \
              BENCH_PAGINATION="$pagination" \
              BENCH_URL="$url" \
              BENCH_TOKEN="$TOKEN" \
              BENCH_REDIS_CACHE="$redis_cache" \
              BENCH_CONCURRENCY="$c" \
              BENCH_REQUESTS="$BENCH_REQUESTS" \
              BENCH_WARMUP="$BENCH_WARMUP" \
              BENCH_TIMEOUT="$BENCH_TIMEOUT" \
              BENCH_REQUIRE_INSTRUMENTATION="$perf" \
              python benchmarks/http_benchmark.py > "$out"
            local rc=$?

            kill "$sampler_pid" 2>/dev/null || true
            wait "$sampler_pid" 2>/dev/null || true
            set -e

            if [[ $rc -ne 0 ]]; then
              echo "benchmark failed: $mode pagination=$pagination C=$c cache=$cache_mode rc=$rc" >&2
              return 1
            fi

            local observed_threads="$(cat "$threads_out" 2>/dev/null || echo 0)"
            python - "$out" "$observed_threads" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          observed = int(sys.argv[2])
          payload = json.loads(path.read_text())
          payload["max_os_threads_observed"] = observed
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
            rm -f "$threads_out"
          }

          # Sync baseline: fixed 11 request threads/worker.
          for pagination in "${PAGINATIONS[@]}"; do
            for cache_mode in "${CACHE_MODES[@]}"; do
              start_server sync "$pagination" 0 "$cache_mode"
              for c in "${CLIENT_CONCURRENCIES[@]}"; do
                run_one sync "$pagination" "$c" final "$cache_mode" 0
              done
            done
            stop_server
          done

          # Async uses Django's real async ORM/request stack. We do NOT cap its
          # thread-sensitive ORM workers to an artificial number; instead we
          # observe how many OS threads it actually needs to exploit the same
          # 11/12 DB capacity per worker.
          for pagination in "${PAGINATIONS[@]}"; do
            for cache_mode in "${CACHE_MODES[@]}"; do
              start_server async "$pagination" 0 "$cache_mode"
              for c in "${CLIENT_CONCURRENCIES[@]}"; do
                run_one async "$pagination" "$c" final "$cache_mode" 0
              done
            done
            stop_server
          done

          for pagination in "${PAGINATIONS[@]}"; do
            start_server sync "$pagination" 1 off
            run_one sync "$pagination" 100 diagnostic off 1
            stop_server
            start_server async "$pagination" 1 off
            run_one async "$pagination" 100 diagnostic off 1
            stop_server
          done

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("benchmark-results-saturated")
          lines = [
              "# Full DB Pool Sync vs Native Django Async",
              "",
              "Configuration: 4 workers; DB pool 12/12 per worker; async DB admission 11/worker; Sync uses 11 request threads/worker. Async uses Django's native async ORM path and its real thread-sensitive execution model; OS threads are observed, not artificially capped.",
              "",
              "| mode | pagination | cache | C | wall s | RPS | p50 ms | p95 ms | p99 ms | max OS threads | failed |",
              "|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for p in sorted((root / "final").glob("*.json")):
              c = json.loads(p.read_text())
              lines.append(
                  f"| {c['mode']} | {c['pagination']} | {'hot' if c.get('redis_product_cache') else 'off'} | {int(c['concurrency'])} | "
                  f"{float(c.get('wall_time_sec') or 0):.3f} | {float(c.get('successful_rps') or 0):.2f} | "
                  f"{float(c.get('p50_ms') or 0):.2f} | {float(c.get('p95_ms') or 0):.2f} | "
                  f"{float(c.get('p99_ms') or 0):.2f} | {int(c.get('max_os_threads_observed') or 0)} | "
                  f"{int(c.get('failed') or 0)} |"
              )

          (root / "report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: PostgreSQL diagnostics
        run: python benchmarks/postgres_diagnostics.py > benchmark-results-saturated/postgres-plan.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturated-db-pool-sync-async-fair
          path: erp-api/benchmark-results-saturated
          if-no-files-found: warn
          retention-days: 14
