name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main, refactor/car-architecture, fix/car-dashboard-card-cleanup]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build full debug APK
        run: flutter build apk --debug --flavor full -t lib/main.dart

      - name: Build car debug APK
        run: flutter build apk --debug --flavor car -t lib/main_car.dart

      - name: Upload car debug APK
        uses: actions/upload-artifact@v4
        with:
          name: car-debug-apk
          path: build/app/outputs/flutter-apk/app-car-debug.apk
          if-no-files-found: error
