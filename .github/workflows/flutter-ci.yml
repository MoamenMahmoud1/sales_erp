name: Flutter CI

on:
  push:
    branches: [main, refactor/car-architecture]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build full debug APK
        run: flutter build apk --debug --flavor full -t lib/main.dart

      - name: Build car debug APK
        run: flutter build apk --debug --flavor car -t lib/main_car.dart
