name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main, refactor/car-architecture]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Production security guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.dart' 'localDevelopmentUser' lib; then
            echo 'Local superuser identity must never exist in production source.'
            exit 1
          fi
          if grep -n 'DemoDataSeeder().seedIfNeeded' lib/main.dart; then
            echo 'Demo data must be compile-time opt-in.'
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release --flavor full --dart-define=API_BASE_URL=https://example.invalid/api/v1
