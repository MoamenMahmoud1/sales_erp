name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main, refactor/car-architecture]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Production security guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.dart' 'localDevelopmentUser' lib; then
            echo 'Local superuser identity must never exist in production source.'
            exit 1
          fi
          if ! grep -n 'enableDemoData' lib/main.dart >/dev/null; then
            echo 'Demo data must be compile-time opt-in.'
            exit 1
          fi

      - name: Create ephemeral CI release keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CI_KEYSTORE_PASSWORD:-}" ]]; then
            CI_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            echo "CI_KEYSTORE_PASSWORD=$CI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEYSTORE_PASSWORD" \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI Release,O=Sales ERP,C=EG"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$CI_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=ci-release"
            echo "ANDROID_KEY_PASSWORD=$CI_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build release APK
        run: flutter build apk --release --flavor full --dart-define=API_BASE_URL=https://example.invalid/api/v1
