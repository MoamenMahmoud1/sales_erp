name: Async Middleware and DB Gate Benchmark

on:
  push:
    branches: [main]
    paths:
      - "erp-api/benchmarks/**"
      - "erp-api/core/middleware.py"
      - "erp-api/core/settings/settings_base.py"
      - "erp-api/core/settings/settings_bench.py"
      - "erp-api/core/settings/settings_prod.py"
      - "erp-api/products/api/views.py"
      - "erp-api/common/services/async_db_gate.py"
      - "erp-api/common/services/perf_timing.py"
      - ".github/workflows/async-tuning-benchmark.yml"
  workflow_dispatch:

concurrency:
  group: async-tuning-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: erp-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "10"
      WEB_CONCURRENCY: "2"
      TRUST_PROXY_HEADERS: "false"
      BENCH_TIMEOUT: "10"
      BENCH_DEADLINE: "60"
      BENCH_PROGRESS_EVERY: "100"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx uvicorn-worker

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py

      - name: Configure PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET effective_cache_size='2GB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET track_io_timing='on';"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 60); do
            if PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c "ANALYZE;"

      - name: Run async tuning matrix
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          TOKEN="$(cat bench_token.txt)"
          BASE="http://127.0.0.1:8000"
          URL="${BASE}/api/v1/products/?page=1&page_size=20"

          start_server() {
            export BENCH_API_STACK=async
            export BENCH_MINIMAL_MIDDLEWARE="$1"
            export ASYNC_DB_CONCURRENCY="$2"
            gunicorn core.asgi:application \
              --bind 127.0.0.1:8000 \
              --workers 2 \
              --worker-class uvicorn_worker.UvicornWorker \
              --timeout 30 \
              --access-logfile /dev/null \
              --error-logfile /tmp/gunicorn-async-tuning.log \
              --log-level warning &
            SERVER_PID=$!
            for attempt in $(seq 1 60); do
              if curl -fsS "$BASE/health/live/" >/dev/null 2>&1; then return; fi
              sleep 1
            done
            cat /tmp/gunicorn-async-tuning.log || true
            exit 1
          }

          stop_server() {
            if [[ -n "${SERVER_PID:-}" ]] && kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" || true
              wait "$SERVER_PID" || true
            fi
            SERVER_PID=""
          }
          trap 'stop_server' EXIT

          run_case() {
            name="$1"
            concurrency="$2"
            BENCH_URL="$URL" \
            BENCH_TOKEN="$TOKEN" \
            BENCH_API_STACK=async \
            BENCH_CONCURRENCY="$concurrency" \
            BENCH_REQUESTS=500 \
            BENCH_WARMUP=100 \
            BENCH_DEADLINE=60 \
            BENCH_PROGRESS_EVERY=100 \
            BENCH_TIMEOUT=10 \
              python benchmarks/http_benchmark.py | tee "benchmark-results/${name}.jsonl"
          }

          # Full Django middleware, no application DB gate.
          start_server 0 0
          run_case async-full-c25 25
          run_case async-full-c100 100
          stop_server

          # Minimal truly-async middleware stack, no DB gate.
          start_server 1 0
          run_case async-minimal-c25 25
          run_case async-minimal-c100 100
          stop_server

          # Full middleware plus bounded DB concurrency. Never configure the
          # application gate above the per-worker pool size of 10.
          for gate in 4 6 8 10; do
            start_server 0 "$gate"
            run_case "async-gate${gate}-c100" 100
            stop_server
          done

      - name: Build tuning report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("benchmark-results")
          rows = []
          for path in sorted(root.glob("*.jsonl")):
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  try:
                      item = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if item.get("phase") == "measured":
                      item["case"] = path.stem
                      rows.append(item)

          def f(value):
              return "" if value is None else f"{value:.3f}" if isinstance(value, float) else str(value)

          report = [
              "# Async middleware + DB gate benchmark",
              "",
              "Every measured case must complete successfully and be runtime-instrumented.",
              "The HTTP benchmark measures from the client before the request until the response body is consumed.",
              "",
              "| case | concurrency | rps | http p50 | http p95 | http p99 | app p50 | admission p50 | pool p50 | sql p50 | sql queries | successful | failed | verified |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|",
          ]
          for row in rows:
              timing = row.get("server_timing", {})
              report.append(
                  "| {case} | {concurrency} | {rps} | {p50} | {p95} | {p99} | {app} | {admission} | {pool} | {sql} | {queries} | {successful} | {failed} | {verified} |".format(
                      case=row["case"],
                      concurrency=row.get("concurrency"),
                      rps=f(row.get("rps")),
                      p50=f(row.get("p50_ms")),
                      p95=f(row.get("p95_ms")),
                      p99=f(row.get("p99_ms")),
                      app=f(timing.get("app", {}).get("p50_ms")),
                      admission=f(timing.get("db_admission", {}).get("p50_ms")),
                      pool=f(timing.get("db_pool", {}).get("p50_ms")),
                      sql=f(timing.get("sql", {}).get("p50_ms")),
                      queries=f(row.get("db_queries_mean")),
                      successful=row.get("successful"),
                      failed=row.get("failed"),
                      verified=row.get("stack_verified"),
                  )
              )

          (root / "report.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          (root / "report.json").write_text(json.dumps(rows, indent=2, sort_keys=True), encoding="utf-8")
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-tuning-benchmark
          path: erp-api/benchmark-results/
          if-no-files-found: warn
