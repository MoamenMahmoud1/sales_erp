name: Backend CI
# Keep backend validation attached to the latest PR commit after CI-only fixes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_test -d erp_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_prod
      SECRET_KEY: ci-test-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: ci-test-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_test
      DB_USER: erp_test
      DB_PASSWORD: erp_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      TRUST_PROXY_HEADERS: "false"
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "5"
      WEB_CONCURRENCY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Dependency integrity
        run: pip check

      - name: Django system checks
        run: python manage.py check --deploy

      - name: Migration checks
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Test suite
        env:
          DJANGO_SETTINGS_MODULE: core.settings.settings_test
        run: python manage.py test --keepdb

      - name: Compile Python
        run: python -m compileall -q .

      - name: Ruff
        run: ruff check .