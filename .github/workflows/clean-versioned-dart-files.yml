name: Clean versioned Dart files

on:
  push:
    branches:
      - fix/car-dashboard-payments-ux

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace versioned Dart files with canonical names
        shell: bash
        run: |
          set -euo pipefail

          declare -A latest_num
          declare -A latest_path
          declare -A bases

          while IFS= read -r -d '' path; do
            if [[ "$path" =~ ^(.+)_v([0-9]+)\.dart$ ]]; then
              base="${BASH_REMATCH[1]}.dart"
              num="${BASH_REMATCH[2]}"
              bases["$base"]=1
              if [[ -z "${latest_num[$base]+x}" || "$num" -gt "${latest_num[$base]}" ]]; then
                latest_num["$base"]="$num"
                latest_path["$base"]="$path"
              fi
            fi
          done < <(find lib test -type f -name '*_v[0-9]*.dart' -print0 2>/dev/null || true)

          for base in "${!latest_path[@]}"; do
            latest="${latest_path[$base]}"
            stem="${base%.dart}"
            mkdir -p "$(dirname "$base")"

            # Promote the highest-numbered implementation to the canonical file.
            cp "$latest" "$base"

            # Remove only versioned siblings for this exact basename.
            for candidate in "${stem}"_v*.dart; do
              [[ -e "$candidate" ]] || continue
              rm -f "$candidate"
            done
          done

          # Canonicalize imports and Dart identifiers such as PageV5 -> Page.
          find lib test -type f -name '*.dart' -print0 2>/dev/null | \
            xargs -0 -r perl -pi -e 's/_v[0-9]+\.dart/.dart/g; s/\b([A-Za-z_][A-Za-z0-9_]*)V[0-9]+\b/$1/g'

          # Keep the public app version on the 0.123 baseline.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          text = p.read_text()
          text, count = re.subn(r'(?m)^version:\s*\S+\s*$', 'version: 0.123.0+123', text, count=1)
          if count != 1:
              raise SystemExit('version field not found')
          p.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/clean-versioned-dart-files.yml 2>/dev/null || true
          git add -A

          if git diff --cached --quiet; then
            echo "No versioned Dart files require cleanup."
            exit 0
          fi

          git commit -m "refactor: use canonical Dart filenames and 0.123 version baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
