name: Fixed 600 Request Benchmark

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark-600.yml"
      - "erp-api/benchmarks/fixed_600.py"
      - "erp-api/core/settings/settings_bench.py"
      - "erp-api/products/api/views.py"
      - "erp-api/products/api/serializers.py"
  workflow_dispatch:

concurrency:
  group: fixed-600-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: erp-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "5"
      WEB_CONCURRENCY: "2"
      TRUST_PROXY_HEADERS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Seed benchmark database
        run: |
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from inventory.models import StockBalance, StockLocation
          from products.models import Product
          from rest_framework_simplejwt.tokens import AccessToken

          User = get_user_model()
          user, _ = User.objects.get_or_create(
              username="fixed_bench_user",
              defaults={"email": "fixed_bench@example.com", "is_active": True, "is_verified": True},
          )

          products = list(Product.objects.all()[:2000])
          if len(products) < 2000:
              start = len(products)
              products.extend(
                  Product.objects.bulk_create(
                      [
                          Product(
                              name=f"Fixed Benchmark Product {index:05d}",
                              purchase_price="10.00",
                              selling_price="15.00",
                          )
                          for index in range(start, 2000)
                      ],
                      batch_size=500,
                  )
              )

          location, _ = StockLocation.objects.get_or_create(
              name="Fixed Benchmark Warehouse",
              defaults={"location_type": StockLocation.LocationType.MAIN_WAREHOUSE},
          )
          StockBalance.objects.bulk_create(
              [
                  StockBalance(location=location, product=product, quantity=100)
                  for product in products
              ],
              batch_size=500,
              ignore_conflicts=True,
          )

          with open("bench_token.txt", "w", encoding="utf-8") as output:
              output.write(str(AccessToken.for_user(user)))
          PY

      - name: Record runner capacity
        run: |
          echo "=== CPU ==="
          nproc
          lscpu | grep -E 'Model name|CPU\\(s\\)|Thread|Core|Socket' || true
          echo "=== MEMORY ==="
          free -h

      - name: Start server
        run: |
          set -euo pipefail
          gunicorn core.asgi:application \
            --bind 127.0.0.1:8000 \
            --workers 2 \
            --worker-class uvicorn_worker.UvicornWorker \
            --timeout 30 \
            --access-logfile /dev/null \
            --error-logfile /tmp/gunicorn-error.log \
            --log-level warning &
          echo $! > /tmp/server.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gunicorn-error.log || true
          exit 1

      - name: Benchmark exactly 600 requests
        run: |
          set -euo pipefail
          TOKEN="$(cat bench_token.txt)"
          URL="http://127.0.0.1:8000/api/v1/products/?page=1&page_size=20"
          python benchmarks/fixed_600.py \
            --url "$URL" \
            --token "$TOKEN" \
            --requests 600 \
            --concurrency 1 \
            --deadline 30
          python benchmarks/fixed_600.py \
            --url "$URL" \
            --token "$TOKEN" \
            --requests 600 \
            --concurrency 600 \
            --deadline 30

          echo "=== SERVER ERRORS ==="
          if [[ -s /tmp/gunicorn-error.log ]]; then
            cat /tmp/gunicorn-error.log
          else
            echo "none"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f bench_token.txt
          if [[ -f /tmp/server.pid ]]; then
            kill "$(cat /tmp/server.pid)" || true
          fi
