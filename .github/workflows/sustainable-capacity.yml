name: Sustainable Sync vs Async Capacity

on:
  pull_request:
    branches: [main]
    paths:
      - "erp-api/common/services/async_db_gate.py"
      - "erp-api/products/api/views.py"
      - "erp-api/products/api/sync_views.py"
      - "erp-api/products/services/**"
      - "erp-api/common/pagination/**"
      - "erp-api/benchmarks/**"
      - "erp-api/core/settings/settings_bench.py"
      - "erp-api/gunicorn.conf.py"
      - ".github/workflows/sustainable-capacity.yml"
  workflow_dispatch:

concurrency:
  group: sustainable-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      WEB_CONCURRENCY: "4"
      DB_POOL_MIN_SIZE: "0"
      DB_POOL_MAX_SIZE: "8"
      ASYNC_DB_CONCURRENCY: "8"
      ASYNC_DB_ADMISSION_TIMEOUT_MS: "0"
      TRUST_PROXY_HEADERS: "false"
      PERF_TIMING_ENABLED: "1"
      BENCH_TIMEOUT: "2"
      BENCH_REQUESTS: "200"
      BENCH_WARMUP: "20"
      MAX_POOL_P95_MS: "50"
      MAX_ERROR_RATE_PCT: "0"
      CALIBRATION_REPEATS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py
      - name: Configure PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker restart "$PG_CONTAINER"
          for _ in $(seq 1 30); do PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c 'SELECT 1' >/dev/null 2>&1 && break; sleep 1; done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c 'ANALYZE;'
      - name: Run fair sync vs async benchmark
        run: |
          set -euo pipefail
          rm -rf benchmark-results
          mkdir -p benchmark-results/calibration benchmark-results/final
          TOKEN="$(cat bench_token.txt)"
          D_VALUES=(1 2 4 8)
          CLIENT_CONCURRENCIES=(1 10 25 50 100)

          stop_server() {
            local pid="$(cat /tmp/gunicorn.pid 2>/dev/null || true)"
            if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
              for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.1; done
              kill -KILL -- "-$pid" 2>/dev/null || true
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f /tmp/gunicorn.pid
          }

          start_server() {
            local mode="$1" pagination="$2" d="$3"
            stop_server
            : > /tmp/gunicorn-benchmark.log
            if [[ "$mode" == "sync" ]]; then
              setsid env BENCH_API_STACK=sync BENCH_PAGINATION="$pagination" DB_POOL_MIN_SIZE=0 DB_POOL_MAX_SIZE=8 ASYNC_DB_CONCURRENCY=0 \
                gunicorn core.wsgi:application --bind 127.0.0.1:8000 --workers "$WEB_CONCURRENCY" --threads "$d" --worker-class gthread \
                --timeout 10 --access-logfile /dev/null --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            else
              setsid env BENCH_API_STACK=async BENCH_PAGINATION="$pagination" DB_POOL_MIN_SIZE=0 DB_POOL_MAX_SIZE=8 ASYNC_DB_CONCURRENCY="$d" \
                gunicorn core.asgi:application --bind 127.0.0.1:8000 --workers "$WEB_CONCURRENCY" --worker-class uvicorn_worker.UvicornWorker \
                --timeout 10 --access-logfile /dev/null --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            fi
            echo $! > /tmp/gunicorn.pid
            for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1 && return 0; sleep 0.2; done
            cat /tmp/gunicorn-benchmark.log >&2 || true
            return 1
          }

          run_one() {
            local mode="$1" pagination="$2" d="$3" c="$4" phase="$5"
            local url="http://127.0.0.1:8000/api/v1/products/?page_size=20"
            local out
            out="benchmark-results/$phase/${mode}-${pagination}-d${d}-c${c}.json"
            set +e
            timeout --signal=TERM --kill-after=1s 6s env \
              BENCH_MODE="$mode" BENCH_PAGINATION="$pagination" BENCH_URL="$url" BENCH_TOKEN="$TOKEN" \
              BENCH_CONCURRENCY="$c" BENCH_REQUESTS="$BENCH_REQUESTS" BENCH_WARMUP="$BENCH_WARMUP" BENCH_TIMEOUT="$BENCH_TIMEOUT" \
              python benchmarks/http_benchmark.py > "$out"
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "benchmark failed: $mode pagination=$pagination D=$d C=$c rc=$rc" >&2
              return 1
            fi
          }

          # D is per-worker server-side concurrency:
          # sync = Gunicorn threads/worker; async = DB admission slots/worker.
          # With 4 workers, total server-side concurrency is D * 4 in both modes.
          for mode in async sync; do
            for d in "${D_VALUES[@]}"; do
              start_server "$mode" cursor "$d"
              run_one "$mode" cursor "$d" 100 calibration
              stop_server
            done
          done

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('benchmark-results/calibration')
          for mode in ('async','sync'):
              good=[]
              for d in (1,2,4,8):
                  p=root/f'{mode}-cursor-d{d}-c100.json'
                  c=json.loads(p.read_text())
                  if c.get('status') == 'complete' and int(c.get('failed') or 0) == 0 and float(c.get('pool_wait_p95_ms') or 0) <= 50:
                      good.append((d,c))
              if not good:
                  raise SystemExit(f'No healthy D for {mode}')
              d, selected=max(good,key=lambda item:(float(item[1].get('successful_rps') or 0),-float(item[1].get('p99_ms') or 0)))
              (root/f'{mode}-selected.env').write_text(f'CAPACITY_PER_WORKER={d}\nCAPACITY_TOTAL={d*4}\n')
              print(f'{mode}: selected D/worker={d} total={d*4} RPS={selected.get("successful_rps")} p95={selected.get("p95_ms")}')
          PY

          get_d() { awk -F= '/^CAPACITY_PER_WORKER=/{print $2}' "benchmark-results/calibration/$1-selected.env"; }
          ASYNC_D="$(get_d async)"
          SYNC_D="$(get_d sync)"

          for pagination in page cursor; do
            for mode in async sync; do
              d="$ASYNC_D"; [[ "$mode" == "sync" ]] && d="$SYNC_D"
              start_server "$mode" "$pagination" "$d"
              for c in "${CLIENT_CONCURRENCIES[@]}"; do
                run_one "$mode" "$pagination" "$d" "$c" final
              done
              stop_server
            done
          done

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('benchmark-results')
          caps={}
          totals={}
          for mode in ('async','sync'):
              vals={}
              for x in (root/'calibration'/f'{mode}-selected.env').read_text().splitlines():
                  k,v=x.split('=',1); vals[k]=int(v)
              caps[mode]=vals['CAPACITY_PER_WORKER']
              totals[mode]=vals['CAPACITY_TOTAL']
          lines=['# Sustainable Sync vs Async Capacity','',
                 f'Fairness: 4 Gunicorn workers for both modes. D is per-worker server-side concurrency: sync = D threads/worker, async = D admission slots/worker. Total server-side D = D × 4. DB pool max is 8 per worker.','',
                 '| mode | pagination | D/worker | total D | client C | wall s | RPS | p50 ms | p95 ms | p99 ms | pool p95 ms | admission p95 ms | failed |',
                 '|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
          for p in sorted((root/'final').glob('*.json')):
              c=json.loads(p.read_text())
              m=c.get('mode','')
              lines.append(f"| {m} | {c.get('pagination','')} | {caps[m]} | {totals[m]} | {int(c.get('concurrency') or 0)} | {float(c.get('wall_time_sec') or 0):.3f} | {float(c.get('successful_rps') or 0):.2f} | {float(c.get('p50_ms') or 0):.2f} | {float(c.get('p95_ms') or 0):.2f} | {float(c.get('p99_ms') or 0):.2f} | {float(c.get('pool_wait_p95_ms') or 0):.2f} | {float(c.get('db_admission_p95_ms') or 0):.2f} | {int(c.get('failed') or 0)} |")
          (root/'report.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: PostgreSQL diagnostics
        if: always()
        run: python benchmarks/postgres_diagnostics.py > benchmark-results/postgres-plan.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustainable-sync-async-capacity
          path: erp-api/benchmark-results
          if-no-files-found: error
          retention-days: 14
