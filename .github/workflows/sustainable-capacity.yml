name: Sustainable Sync vs Async Capacity

on:
  pull_request:
    branches: [main]
    paths:
      - "erp-api/common/services/async_db_gate.py"
      - "erp-api/products/api/views.py"
      - "erp-api/products/api/sync_views.py"
      - "erp-api/products/services/**"
      - "erp-api/common/pagination/**"
      - "erp-api/benchmarks/**"
      - "erp-api/core/settings/settings_bench.py"
      - "erp-api/core/settings/settings_api.py"
      - "erp-api/core/settings/settings_prod.py"
      - "erp-api/core/benchmark_urls.py"
      - "erp-api/core/middleware.py"
      - "erp-api/Dockerfile"
      - "erp-api/gunicorn.conf.py"
      - ".github/workflows/sustainable-capacity.yml"
  workflow_dispatch:

concurrency:
  group: sustainable-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      DB_POOL_MIN_SIZE: "0"
      DB_POOL_MAX_SIZE: "12"
      ASYNC_DB_CONCURRENCY: "8"
      ASYNC_DB_ADMISSION_TIMEOUT_MS: "250"
      TRUST_PROXY_HEADERS: "false"
      PERF_TIMING_ENABLED: "1"
      BENCH_TIMEOUT: "2"
      BENCH_REQUESTS: "200"
      BENCH_WARMUP: "20"
      MAX_POOL_P95_MS: "50"
      MAX_ADMISSION_P95_MS: "250"
      MAX_ERROR_RATE_PCT: "0"
      CALIBRATION_REPEATS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx
      - name: Migrate
        id: migrate
        run: python manage.py migrate --noinput
      - name: Seed benchmark database
        id: seed
        run: python benchmarks/seed_benchmark_data.py
      - name: Configure PostgreSQL
        id: postgres
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker restart "$PG_CONTAINER"
          for _ in $(seq 1 30); do PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c 'SELECT 1' >/dev/null 2>&1 && break; sleep 1; done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c 'ANALYZE;'
      - name: Run optimized sync vs async benchmark
        id: benchmark
        if: steps.migrate.outcome == 'success' && steps.seed.outcome == 'success' && steps.postgres.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf benchmark-results
          mkdir -p benchmark-results/calibration benchmark-results/final benchmark-results/diagnostic
          TOKEN="$(cat bench_token.txt)"
          WORKER_VALUES=(1 2 4)
          SYNC_D_VALUES=(1 2 4 6 8 10)
          ASYNC_D_VALUES=(2 4 6 8 10)
          CLIENT_CONCURRENCIES=(1 10 25 50 100 150)
          CACHE_MODES=(off hot)
          CALIBRATION_C=50

          clear_redis_cache() {
            python - <<'PY'
          import os
          import redis
          redis.from_url(os.environ["REDIS_URL"]).flushdb()
          PY
          }

          stop_server() {
            local pid="$(cat /tmp/gunicorn.pid 2>/dev/null || true)"
            if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
              for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 0.1; done
              kill -KILL -- "-$pid" 2>/dev/null || true
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f /tmp/gunicorn.pid
          }

          start_server() {
            local mode="$1" pagination="$2" workers="$3" d="$4" perf="$5" cache_mode="$6"
            local cache_enabled=0
            if [[ "$cache_mode" == "hot" ]]; then cache_enabled=1; fi
            stop_server
            clear_redis_cache
            : > /tmp/gunicorn-benchmark.log
            if [[ "$mode" == "sync" ]]; then
              setsid env BENCH_API_STACK=sync BENCH_PAGINATION="$pagination" PERF_TIMING_ENABLED="$perf" PRODUCT_LIST_CACHE_ENABLED="$cache_enabled" DB_POOL_MIN_SIZE=0 DB_POOL_MAX_SIZE=12 ASYNC_DB_CONCURRENCY=0 \
                gunicorn core.wsgi:application --bind 127.0.0.1:8000 --workers "$workers" --threads "$d" --worker-class gthread \
                --timeout 10 --access-logfile /dev/null --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            else
              setsid env BENCH_API_STACK=async BENCH_PAGINATION="$pagination" PERF_TIMING_ENABLED="$perf" PRODUCT_LIST_CACHE_ENABLED="$cache_enabled" DB_POOL_MIN_SIZE=0 DB_POOL_MAX_SIZE=12 ASYNC_DB_CONCURRENCY="$d" \
                gunicorn core.asgi:application --bind 127.0.0.1:8000 --workers "$workers" --worker-class uvicorn_worker.UvicornWorker \
                --timeout 10 --access-logfile /dev/null --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            fi
            echo $! > /tmp/gunicorn.pid
            for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1 && return 0; sleep 0.2; done
            cat /tmp/gunicorn-benchmark.log >&2 || true
            return 1
          }

          run_one() {
            local mode="$1" pagination="$2" workers="$3" d="$4" c="$5" phase="$6" require_instrumentation="$7" cache_mode="$8"
            local url="http://127.0.0.1:8000/api/v1/products/?page_size=20"
            local out="benchmark-results/$phase/${mode}-w${workers}-d${d}-${pagination}-c${c}-${cache_mode}.json"
            local redis_cache=0
            if [[ "$cache_mode" == "hot" ]]; then redis_cache=1; fi
            set +e
            # Do not cap a run at a fixed 6s: with C=1, 200 requests may need
            # longer even when every individual request is healthy. The
            # benchmark has its own per-request timeout and the job has a
            # global 15-minute timeout.
            timeout --signal=TERM --kill-after=5s 120s env \
              BENCH_MODE="$mode" BENCH_PAGINATION="$pagination" BENCH_URL="$url" BENCH_TOKEN="$TOKEN" \
              BENCH_REDIS_CACHE="$redis_cache" BENCH_CONCURRENCY="$c" BENCH_REQUESTS="$BENCH_REQUESTS" BENCH_WARMUP="$BENCH_WARMUP" BENCH_TIMEOUT="$BENCH_TIMEOUT" \
              BENCH_REQUIRE_INSTRUMENTATION="$require_instrumentation" python benchmarks/http_benchmark.py > "$out"
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "benchmark failed: $mode pagination=$pagination workers=$workers D=$d C=$c cache=$cache_mode rc=$rc" >&2
              return 1
            fi
          }

          for mode in async sync; do
            if [[ "$mode" == "sync" ]]; then d_values=("${SYNC_D_VALUES[@]}"); else d_values=("${ASYNC_D_VALUES[@]}"); fi
            for workers in "${WORKER_VALUES[@]}"; do
              for d in "${d_values[@]}"; do
                start_server "$mode" cursor "$workers" "$d" 1 off
                run_one "$mode" cursor "$workers" "$d" "$CALIBRATION_C" calibration 0 off
                stop_server
              done
            done
          done

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('benchmark-results/calibration')
          for mode in ('async','sync'):
              candidates=[]
              for p in root.glob(f'{mode}-w*-d*-cursor-c50-off.json'):
                  parts=p.stem.split('-')
                  workers=int(parts[1][1:]); d=int(parts[2][1:])
                  c=json.loads(p.read_text())
                  if c.get('status') != 'complete':
                      continue
                  failed=int(c.get('failed') or 0)
                  pool=float(c.get('pool_wait_p95_ms') or 0)
                  admission=float(c.get('db_admission_p95_ms') or 0)
                  rps=float(c.get('successful_rps') or 0)
                  p95=float(c.get('p95_ms') or 0)
                  p99=float(c.get('p99_ms') or 0)
                  if failed == 0 and pool <= 50 and admission <= 250:
                      candidates.append((rps,-p95,-p99,-pool,-admission,workers,d,c))
              if not candidates:
                  raise SystemExit(f'No healthy worker/D configuration for {mode}')
              _,_,_,_,_,workers,d,c=max(candidates)
              (root/f'{mode}-selected.env').write_text(f'WORKERS={workers}\nD_PER_WORKER={d}\nTOTAL_D={workers*d}\n')
              print(f'{mode}: workers={workers} D/worker={d} total={workers*d} RPS={c.get("successful_rps")} p95={c.get("p95_ms")} p99={c.get("p99_ms")} pool_p95={c.get("pool_wait_p95_ms")} admission_p95={c.get("db_admission_p95_ms")}')
          PY

          get_value() { awk -F= -v k="$2" '$1==k{print $2}' "benchmark-results/calibration/$1-selected.env"; }
          ASYNC_WORKERS="$(get_value async WORKERS)"
          ASYNC_D="$(get_value async D_PER_WORKER)"
          SYNC_WORKERS="$(get_value sync WORKERS)"
          SYNC_D="$(get_value sync D_PER_WORKER)"

          for pagination in page cursor; do
            for cache_mode in "${CACHE_MODES[@]}"; do
              start_server async "$pagination" "$ASYNC_WORKERS" "$ASYNC_D" 0 "$cache_mode"
              for c in "${CLIENT_CONCURRENCIES[@]}"; do
                run_one async "$pagination" "$ASYNC_WORKERS" "$ASYNC_D" "$c" final 0 "$cache_mode"
              done
              stop_server
              start_server sync "$pagination" "$SYNC_WORKERS" "$SYNC_D" 0 "$cache_mode"
              for c in "${CLIENT_CONCURRENCIES[@]}"; do
                run_one sync "$pagination" "$SYNC_WORKERS" "$SYNC_D" "$c" final 0 "$cache_mode"
              done
              stop_server
            done
          done

          for pagination in page cursor; do
            for cache_mode in "${CACHE_MODES[@]}"; do
              start_server async "$pagination" "$ASYNC_WORKERS" "$ASYNC_D" 1 "$cache_mode"
              run_one async "$pagination" "$ASYNC_WORKERS" "$ASYNC_D" 100 diagnostic 0 "$cache_mode"
              stop_server
              start_server sync "$pagination" "$SYNC_WORKERS" "$SYNC_D" 1 "$cache_mode"
              run_one sync "$pagination" "$SYNC_WORKERS" "$SYNC_D" 100 diagnostic 0 "$cache_mode"
              stop_server
            done
          done

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('benchmark-results')
          for p in sorted((root/'diagnostic').glob('*.json')):
              payload=json.loads(p.read_text())
              app=payload.get('server_timing',{}).get('app',{}).get('count',0)
              if int(app or 0) <= 0:
                  raise SystemExit(f'Instrumentation missing from {p.name}')
          vals={}
          for mode in ('async','sync'):
              d={}
              for line in (root/'calibration'/f'{mode}-selected.env').read_text().splitlines():
                  k,v=line.split('=',1); d[k]=int(v)
              vals[mode]=d
          lines=['# Optimized Sync vs Async Capacity','',
                 'Clean final runs disable instrumentation. Diagnostic runs at C=100 keep stage timings for root-cause analysis. Each architecture is independently optimized; DB pool max is 12 per worker and async admission stays below the pool for async. Redis hot-cache runs use one warm-up request to avoid cache-miss stampede.','',
                 '| mode | workers | D/worker | total D | pagination | redis cache | client C | wall s | RPS | p50 ms | p95 ms | p99 ms | failed |',
                 '|---|---:|---:|---:|---|---|---:|---:|---:|---:|---:|---:|---:|']
          for p in sorted((root/'final').glob('*.json')):
              c=json.loads(p.read_text()); m=c.get('mode','')
              cache='hot' if c.get('redis_product_cache') else 'off'
              lines.append(f"| {m} | {vals[m]['WORKERS']} | {vals[m]['D_PER_WORKER']} | {vals[m]['TOTAL_D']} | {c.get('pagination','')} | {cache} | {int(c.get('concurrency') or 0)} | {float(c.get('wall_time_sec') or 0):.3f} | {float(c.get('successful_rps') or 0):.2f} | {float(c.get('p50_ms') or 0):.2f} | {float(c.get('p95_ms') or 0):.2f} | {float(c.get('p99_ms') or 0):.2f} | {int(c.get('failed') or 0)} |")
          (root/'report.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: PostgreSQL diagnostics
        if: steps.migrate.outcome == 'success' && steps.seed.outcome == 'success' && steps.postgres.outcome == 'success'
        run: python benchmarks/postgres_diagnostics.py > benchmark-results/postgres-plan.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustainable-sync-async-capacity
          path: erp-api/benchmark-results
          if-no-files-found: warn
          retention-days: 14
