name: Sustainable Sync vs Async Capacity

on:
  pull_request:
    branches: [main]
    paths:
      - "erp-api/common/services/async_db_gate.py"
      - "erp-api/products/api/views.py"
      - "erp-api/products/api/sync_views.py"
      - "erp-api/products/services/**"
      - "erp-api/common/pagination/**"
      - "erp-api/benchmarks/**"
      - "erp-api/core/settings/settings_bench.py"
      - "erp-api/core/settings/settings_prod.py"
      - "erp-api/gunicorn.conf.py"
      - ".github/workflows/sustainable-capacity.yml"
  workflow_dispatch:

concurrency:
  group: sustainable-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: erp-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_bench
          POSTGRES_USER: erp_bench
          POSTGRES_PASSWORD: erp_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U erp_bench -d erp_bench"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DJANGO_SETTINGS_MODULE: core.settings.settings_bench
      SECRET_KEY: bench-secret-key-please-use-32-or-more-random-characters-2026
      JWT_SIGNING_KEY: bench-jwt-signing-key-please-use-32-or-more-random-characters-2026
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DB_NAME: erp_bench
      DB_USER: erp_bench
      DB_PASSWORD: erp_bench
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      WEB_CONCURRENCY: "4"
      DB_POOL_MIN_SIZE: "0"
      DB_POOL_MAX_SIZE: "8"
      ASYNC_DB_CONCURRENCY: "8"
      ASYNC_DB_ADMISSION_TIMEOUT_MS: "0"
      TRUST_PROXY_HEADERS: "false"
      PERF_TIMING_ENABLED: "1"
      BENCH_TIMEOUT: "10"
      BENCH_REQUESTS: "500"
      BENCH_WARMUP: "100"
      MAX_POOL_P95_MS: "50"
      MAX_ERROR_RATE_PCT: "0"
      CALIBRATION_REPEATS: "3"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: erp-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Seed benchmark database
        run: python benchmarks/seed_benchmark_data.py
      - name: Configure PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_buffers='512MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET work_mem='16MB';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET random_page_cost='1.1';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET jit='off';"
          docker exec "$PG_CONTAINER" psql -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements';"
          docker restart "$PG_CONTAINER"
          for _ in $(seq 1 60); do
            PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;'
          PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -v ON_ERROR_STOP=1 -c 'ANALYZE;'
      - name: Run repeated sustainable calibration
        run: |
          set -euo pipefail
          rm -rf benchmark-results
          mkdir -p benchmark-results/calibration/{async,sync}/{page,cursor} benchmark-results/final
          TOKEN="$(cat bench_token.txt)"
          CAPACITY_VALUES=(1 2 3 4 5 6 7 8)
          CLIENT_CONCURRENCIES=(1 10 25 50 75 100 150)

          url_for() {
            if [[ "$1" == "cursor" ]]; then
              printf '%s\n' 'http://127.0.0.1:8000/api/v1/products/?page_size=20'
            else
              printf '%s\n' 'http://127.0.0.1:8000/api/v1/products/?page=1&page_size=20'
            fi
          }

          stop_server() {
            local pid="$(cat /tmp/gunicorn.pid 2>/dev/null || true)"
            if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              kill -TERM "$pid" 2>/dev/null || true
              for _ in $(seq 1 40); do kill -0 "$pid" 2>/dev/null || break; sleep 0.25; done
              kill -KILL -- "-$pid" 2>/dev/null || true
              kill -KILL "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f /tmp/gunicorn.pid
          }

          start_server() {
            local mode="$1" pagination="$2" cap="$3"
            stop_server
            : > /tmp/gunicorn-benchmark.log
            if [[ "$mode" == "sync" ]]; then
              setsid env BENCH_API_STACK=sync BENCH_PAGINATION="$pagination" \
                DB_POOL_MIN_SIZE=0 DB_POOL_MAX_SIZE=8 ASYNC_DB_CONCURRENCY=0 \
                gunicorn core.wsgi:application --bind 127.0.0.1:8000 \
                --workers "$WEB_CONCURRENCY" --threads "$cap" --worker-class gthread \
                --timeout 30 --access-logfile /dev/null \
                --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            else
              setsid env BENCH_API_STACK=async BENCH_PAGINATION="$pagination" \
                DB_POOL_MIN_SIZE=0 DB_POOL_MAX_SIZE=8 ASYNC_DB_CONCURRENCY="$cap" \
                gunicorn core.asgi:application --bind 127.0.0.1:8000 \
                --workers "$WEB_CONCURRENCY" --worker-class uvicorn_worker.UvicornWorker \
                --timeout 30 --access-logfile /dev/null \
                --error-logfile /tmp/gunicorn-benchmark.log --log-level warning &
            fi
            echo $! > /tmp/gunicorn.pid
            for _ in $(seq 1 60); do
              curl -fsS http://127.0.0.1:8000/health/live/ >/dev/null 2>&1 && return 0
              sleep 1
            done
            cat /tmp/gunicorn-benchmark.log >&2 || true
            return 1
          }

          run_one() {
            local mode="$1" pagination="$2" cap="$3" c="$4" repeat="$5"
            local url out detail
            url="$(url_for "$pagination")"
            out="benchmark-results/calibration/$mode/$pagination/${mode}-cal-d${cap}-r${repeat}-c${c}.json"
            detail="benchmark-results/calibration/$mode/$pagination/${mode}-cal-d${cap}-r${repeat}-c${c}-requests.ndjson"
            BENCH_MODE="$mode" BENCH_PAGINATION="$pagination" BENCH_URL="$url" \
              BENCH_TOKEN="$TOKEN" BENCH_CONCURRENCY="$c" BENCH_REQUESTS="$BENCH_REQUESTS" \
              BENCH_WARMUP="$BENCH_WARMUP" BENCH_TIMEOUT="$BENCH_TIMEOUT" \
              BENCH_DETAIL_PATH="$detail" python benchmarks/http_benchmark.py > "$out"
          }

          # First: capacity calibration at the stress point C=100, with pool fixed at 8/worker.
          for mode in async sync; do
            for pagination in page cursor; do
              for cap in "${CAPACITY_VALUES[@]}"; do
                for repeat in $(seq 1 "$CALIBRATION_REPEATS"); do
                  start_server "$mode" "$pagination" "$cap"
                  PGPASSWORD=erp_bench psql -h 127.0.0.1 -U erp_bench -d erp_bench -c 'SELECT pg_stat_statements_reset();' >/dev/null
                  run_one "$mode" "$pagination" "$cap" 100 "$repeat"
                  stop_server
                done
              done
            done
          done

          # Aggregate only the calibration stress-point files. The helper expects dN-rN.json names.
          for mode in async sync; do
            for pagination in page cursor; do
              dir="benchmark-results/calibration/$mode/$pagination"
              for cap in "${CAPACITY_VALUES[@]}"; do
                for repeat in $(seq 1 "$CALIBRATION_REPEATS"); do
                  src="$dir/${mode}-cal-d${cap}-r${repeat}-c100.json"
                  dst="$dir/${mode}-cal-d${cap}-r${repeat}.json"
                  cp "$src" "$dst"
                done
              done
              CALIBRATION_DIR="$dir" CALIBRATION_PREFIX="${mode}-cal" CALIBRATION_REPEATS="$CALIBRATION_REPEATS" \
                python benchmarks/aggregate_calibration.py
              MAX_POOL_P95_MS="$MAX_POOL_P95_MS" MAX_ERROR_RATE_PCT="$MAX_ERROR_RATE_PCT" \
                CALIBRATION_DIR="$dir" CALIBRATION_PREFIX="${mode}-cal" \
                python benchmarks/select_sustainable_capacity.py
            done
          done

          # Read one common capacity per mode: the smaller selected capacity across page/cursor,
          # so the selected runtime is safe for both pagination strategies.
          ASYNC_PAGE=$(awk -F= '/CAPACITY_PER_WORKER/{print $2}' benchmark-results/calibration/async/page/async-cal-selected.env)
          ASYNC_CURSOR=$(awk -F= '/CAPACITY_PER_WORKER/{print $2}' benchmark-results/calibration/async/cursor/async-cal-selected.env)
          SYNC_PAGE=$(awk -F= '/CAPACITY_PER_WORKER/{print $2}' benchmark-results/calibration/sync/page/sync-cal-selected.env)
          SYNC_CURSOR=$(awk -F= '/CAPACITY_PER_WORKER/{print $2}' benchmark-results/calibration/sync/cursor/sync-cal-selected.env)
          ASYNC_CAP=$(( ASYNC_PAGE < ASYNC_CURSOR ? ASYNC_PAGE : ASYNC_CURSOR ))
          SYNC_CAP=$(( SYNC_PAGE < SYNC_CURSOR ? SYNC_PAGE : SYNC_CURSOR ))

          # Final pressure curve using one common sustainable capacity per mode.
          for pagination in page cursor; do
            for c in "${CLIENT_CONCURRENCIES[@]}"; do
              for mode in async sync; do
                cap="$ASYNC_CAP"; [[ "$mode" == "sync" ]] && cap="$SYNC_CAP"
                start_server "$mode" "$pagination" "$cap"
                run_one "$mode" "$pagination" "$cap" "$c" 1
                mv "benchmark-results/calibration/$mode/$pagination/${mode}-cal-d${cap}-r1-c${c}.json" \
                   "benchmark-results/final/${mode}-${pagination}-c${c}.json"
                stop_server
              done
            done
          done

      - name: PostgreSQL diagnostics
        if: always()
        run: |
          python benchmarks/postgres_diagnostics.py > benchmark-results/postgres-plan.json
      - name: Build sustainable report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('benchmark-results')

          def selected_capacity(mode):
              selected = []
              for pagination in ('page', 'cursor'):
                  env_path = root / 'calibration' / mode / pagination / f'{mode}-cal-selected.env'
                  for line in env_path.read_text().splitlines():
                      if line.startswith('CAPACITY_PER_WORKER='):
                          selected.append(int(line.split('=', 1)[1]))
                          break
                  else:
                      raise RuntimeError(f'CAPACITY_PER_WORKER missing from {env_path}')
              return min(selected)

          capacities = {
              'async': selected_capacity('async'),
              'sync': selected_capacity('sync'),
          }

          lines = ['# Sustainable Sync vs Async Capacity', '',
                   'DB pool is fixed at 8 connections/worker. Sync capacity is Gunicorn threads; Async capacity is DB admission gate.',
                   'Calibration uses 3 repeats at C=100. Pool p95 > 50 ms or any error makes a capacity unhealthy.', '',
                   '## Final pressure curve', '',
                   '| mode | pagination | capacity/worker | C | wall s | RPS | p50 ms | p95 ms | p99 ms | pool p95 ms | admission p95 ms | failed |',
                   '|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|']
          for p in sorted((root/'final').glob('*.json')):
              c=json.loads(p.read_text())
              mode = c.get('mode', '')
              client_concurrency = int(c.get('concurrency') or 0)
              capacity = capacities[mode]
              lines.append(f"| {mode} | {c.get('pagination','')} | {capacity} | {client_concurrency} | {float(c.get('wall_time_sec') or 0):.3f} | {float(c.get('successful_rps') or 0):.2f} | {float(c.get('p50_ms') or 0):.2f} | {float(c.get('p95_ms') or 0):.2f} | {float(c.get('p99_ms') or 0):.2f} | {float(c.get('pool_wait_p95_ms') or 0):.2f} | {float(c.get('db_admission_p95_ms') or 0):.2f} | {int(c.get('failed') or 0)} |")
          (root/'report.md').write_text('\n'.join(lines)+'\n')
          PY
          cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustainable-sync-async-capacity
          path: erp-api/benchmark-results
          if-no-files-found: error
          retention-days: 14
